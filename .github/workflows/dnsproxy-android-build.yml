name: DNSProxy Android build

# Отдельный reusable-workflow для сборки DNS-форвардера dnsproxy под Android.
#
# Зачем он нужен:
#   Профили FPTN измеряются в изолированном network namespace (см. FptnProbeRunner).
#   Внутри netns системный resolver Android возвращает fake-IP активного VPN,
#   поэтому нужен локальный DNS-форвардер, который:
#     - слушает на 127.0.0.1:53 внутри netns;
#     - форвардит запросы на upstream из НАСТРОЕК ПОЛЬЗОВАТЕЛЯ
#       (udp/tcp/tls/https/quic/sdns - все пять транспортов);
#     - не подменяет DNS никаким hardcoded-провайдером.
#   dnsproxy (AdGuardTeam) - проверенный форвардер с Apache-2.0 лицензией,
#   чистый Go без cgo (CGO_ENABLED=0), поэтому кросс-компилируется под
#   android/arm64 так же, как mimic-client (тоже без NEEDED-зависимостей).
#
# Почему отдельный workflow, а не шаг в build.yml:
#   dnsproxy v0.86.0 требует Go 1.26.8, а build.yml использует Go 1.25 для
#   sing-box/mimic (проверено рабочей сборкой). Отдельный workflow со своей
#   версией Go изолирует риск: Go 1.26.8 для dnsproxy НЕ затрагивает уже
#   работающие сборки sing-box/mimic на Go 1.25. Именно поэтому выбрана
#   актуальная стабильная версия dnsproxy, а не устаревшая под старый Go.
#
# Hard-gate: build.yml НЕ соберёт APK, если dnsproxy не собран или его SHA не совпал.

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      sha256:
        value: ${{ jobs.build-dnsproxy-android.outputs.sha256 }}
      size:
        value: ${{ jobs.build-dnsproxy-android.outputs.size }}

permissions:
  contents: read

concurrency:
  group: dnsproxy-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-dnsproxy-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.stage.outputs.sha256 }}
      size: ${{ steps.stage.outputs.size }}
    steps:
      - name: Checkout dnsproxy source
        uses: actions/checkout@v7
        with:
          repository: AdGuardTeam/dnsproxy
          ref: v0.86.0
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache: true

      - name: Build dnsproxy for android/arm64
        shell: bash
        run: |
          set -euo pipefail
          # Чистый Go без cgo: CGO_ENABLED=0 гарантирует статический бинарник
          # без зависимостей от bionic libc, как у mimic-client.
          # GOOS=android GOARCH=arm64 - целевая платформа устройства.
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build -trimpath -buildvcs=false \
            -ldflags="-s -w" \
            -o dnsproxy .

      - name: Verify and stage the binary
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          # Объективная проверка через readelf (не эвристика `file`):
          #
          # 1. ELF-заголовок: класс ELF64, машина AArch64 (0xB7) - целевая
          #    архитектура устройства, а не x86-64 хоста.
          # 2. ОТСУТСТВИЕ записей NEEDED - это и есть корректный признак чистой
          #    Go-сборки без cgo на Android. Проверено на эталоне: mimic-client
          #    (собранный в build.yml с CGO_ENABLED=0 GOOS=android) НЕ имеет NEEDED,
          #    тогда как sing-box (CGO_ENABLED=1) имеет liblog/libdl/libm/libandroid/libc.
          #
          # ВАЖНО про PT_INTERP: для GOOS=android Go ВСЕГДА добавляет интерпретатор
          #    /system/bin/linker64 даже при CGO_ENABLED=0 (особенность Android-таргета,
          #    подтверждено на mimic-client). Поэтому наличие PT_INTERP НЕ является
          #    признаком динамической линковки и НЕ должно ронять сборку. Ранняя
          #    проверка `file ... dynamically linked` ошибочно падала именно на этом.
          #    Единственный надёжный критерий "чистый Go без cgo" - отсутствие NEEDED.

          echo "=== ELF-заголовок ==="
          readelf -h dnsproxy | grep -E "Class|Machine|Type"

          # Класс и архитектура: ELF64 + AArch64 (arm64), а не x86-64 хоста.
          readelf -h dnsproxy | grep -q "Class:.*ELF64" \
            || { echo "::error::dnsproxy is not ELF64"; exit 1; }
          readelf -h dnsproxy | grep -qiE "Machine:.*AArch64" \
            || { echo "::error::dnsproxy is not AArch64/arm64"; exit 1; }

          # Чистый Go без cgo: нет NEEDED-зависимостей от bionic-библиотек.
          if readelf -d dnsproxy 2>/dev/null | grep -q "NEEDED"; then
            echo "::error::dnsproxy has NEEDED shared libraries; expected none for a CGO_ENABLED=0 Go binary"
            readelf -d dnsproxy | grep "NEEDED" || true
            exit 1
          fi

          echo "dnsproxy is a static AArch64 ELF (no NEEDED shared libraries)."

          SHA="$(sha256sum dnsproxy | cut -d' ' -f1)"
          SIZE="$(stat -c%s dnsproxy)"
          echo "dnsproxy sha256=$SHA size=$SIZE"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          {
            echo "## DNSProxy (android/arm64)"
            echo '```'
            readelf -h dnsproxy | grep -E "Class|Machine|Type"
            echo "static: no NEEDED (pure Go, CGO_ENABLED=0)"
            echo "sha256: $SHA"
            echo "size:   $SIZE bytes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dnsproxy artifact
        uses: actions/upload-artifact@v7
        with:
          name: dnsproxy-android-arm64
          path: dnsproxy
          if-no-files-found: error
          retention-days: 7
