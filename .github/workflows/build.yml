name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel to publish"
        required: false
        type: choice
        default: "none"
        options:
          - none
          - stable
          - prerelease
      version_bump:
        description: "Version bump (prerelease: bump makes the beta newer than stable; stable: keep none to publish current, then master auto-advances)"
        required: false
        type: choice
        default: "none"
        options:
          - none
          - patch
          - minor
          - major
      release_tag:
        description: "Optional explicit release tag (overrides channel naming)"
        required: false
        type: string

# Dispatch-only on purpose. This workflow used to also run on every push to
# master, which produced a second full APK build alongside whatever else touched
# the same commit (a manual sync, or a second dispatch) - the "two nearly
# identical builds" in the Actions list. Builds now happen ONLY when explicitly
# requested:
#   release_channel=stable     -> publish a stable release (moves Latest)
#   release_channel=prerelease -> publish a beta (prerelease flag)
#   release_channel=none       -> build + run tests to verify, publish nothing
# Nothing builds automatically on push any more.

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # FPTN is a hard gate: the APK must not be produced unless the FPTN client was
  # really cross-compiled for Android. It lives in a separate job because its
  # Conan+NDK build is slow and independent of the Gradle build.
  fptn:
    uses: ./.github/workflows/fptn-android-probe.yml
    with:
      fptn_tag: "0.4.6"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: fptn

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare release version and tag
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          # Release channels mirror upstream 2dust/v2rayNG, where master carries the
          # NEXT version and the in-development build is published as a GitHub
          # *prerelease* (their 2.4.0 was a prerelease while 2.3.15 was the stable
          # Latest). The app then picks a channel:
          #   "Check pre-release versions" OFF -> /releases/latest, which GitHub
          #       resolves to the newest non-draft, non-prerelease release;
          #   ON -> /releases, newest by published_at, betas included.
          #
          # For the switch to mean anything, a beta must carry a HIGHER dotted
          # version than the stable build the user has installed: the app compares
          # only the dotted prefix of the tag (v2.4.1-beta.2026... -> 2.4.1) and
          # offers an update only when it is greater. That is why publishing a
          # stable release bumps master to the next patch afterwards, opening the
          # next development cycle - exactly the upstream release train.
          CHANNEL="${{ inputs.release_channel || 'none' }}"
          BUMP="${{ inputs.version_bump || 'none' }}"
          EXPLICIT_TAG="${{ inputs.release_tag || '' }}"
          GRADLE="V2rayNG/app/build.gradle.kts"

          CUR_VER="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$GRADLE" | head -n1)"
          CUR_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9]*\).*/\1/p' "$GRADLE" | head -n1)"
          [ -n "$CUR_VER" ] || { echo "::error::cannot read versionName"; exit 1; }
          [ -n "$CUR_CODE" ] || { echo "::error::cannot read versionCode"; exit 1; }
          echo "Current version in master: $CUR_VER (versionCode $CUR_CODE)"

          bump_version() {
            # POSIX read from a here-doc rather than bash's `<<<` herestring, so
            # the same snippet can be exercised under plain sh.
            local v="$1" how="$2" a b c
            IFS=. read -r a b c <<EOF
          $v
          EOF
            case "$how" in
              major) echo "$((a + 1)).0.0" ;;
              minor) echo "$a.$((b + 1)).0" ;;
              patch) echo "$a.$b.$((c + 1))" ;;
              *)     echo "$v" ;;
            esac
          }

          # No channel and no explicit tag: plain push build, publish nothing.
          if [ "$CHANNEL" = "none" ] && [ -z "$EXPLICIT_TAG" ]; then
            {
              echo "release_tag="
              echo "prerelease=false"
              echo "version=$CUR_VER"
              echo "version_code=$CUR_CODE"
              echo "bump_after_release=false"
            } >> "$GITHUB_OUTPUT"
            echo "No release channel selected: building without publishing."
            exit 0
          fi

          # Версия и номер сборки меняются ТОЛЬКО по явной команде владельца.
          # Владелец ведёт нумерацию по апстриму 2dust и сам решает, когда её
          # поднять. Автоматический bump patch-уровня для беты УБРАН: он молча
          # поднимал versionName/versionCode выше апстрима. Теперь:
          #   version_bump=none  -> версия берётся как есть из build.gradle.kts;
          #   version_bump=patch/minor/major -> явный выбор владельца при запуске.
          EFFECTIVE_BUMP="$BUMP"
          NEW_VER="$(bump_version "$CUR_VER" "$EFFECTIVE_BUMP")"
          if [ "$EFFECTIVE_BUMP" = "none" ]; then
            NEW_CODE="$CUR_CODE"
          else
            NEW_CODE=$((CUR_CODE + 1))
          fi

          if [ -n "$EXPLICIT_TAG" ]; then
            TAG="$EXPLICIT_TAG"
            # An explicit tag decides its own channel from its name, so
            # v1.2.3-beta.1 is still published as a prerelease.
            PRE="false"
            case "$EXPLICIT_TAG" in
              *beta*|*alpha*|*rc*|*-pre*) PRE="true" ;;
            esac
            # The built APK must report the SAME version as the tag it is
            # published under. Otherwise versionName stays at the old value, the
            # app's compareVersions() sees no difference and the release can never
            # be offered as an update - which is exactly the bug that made the
            # "check pre-release versions" switch look dead.
            TAG_VER="$(printf '%s' "$TAG" | sed -e 's/^v//' -e 's/-.*$//')"
            if printf '%s' "$TAG_VER" | grep -qE '^[0-9]+(\.[0-9]+)+$'; then
              NEW_VER="$TAG_VER"
            else
              echo "::error::Cannot read a dotted version out of tag '${TAG}' (got '${TAG_VER}'). Use e.g. v2.4.1 or v2.4.1-beta.1."
              exit 1
            fi
          elif [ "$CHANNEL" = "prerelease" ]; then
            TAG="v${NEW_VER}-beta.$(date -u +%Y%m%d-%H%M%S)"
            PRE="true"
          else
            TAG="v${NEW_VER}"
            PRE="false"
          fi

          # Refuse to clobber an existing tag: that would silently overwrite a
          # published release instead of failing loudly.
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Choose version_bump=patch/minor/major to publish a new version."
            exit 1
          fi

          # Версию в build.gradle.kts правим ТОЛЬКО при явном bump, выбранном
          # владельцем в этом запуске. При version_bump=none файл не трогаем:
          # APK получает ровно ту версию, что зафиксировал владелец в master.
          if [ "$EFFECTIVE_BUMP" != "none" ]; then
            sed -i -E "s/^([[:space:]]*versionCode[[:space:]]*=[[:space:]]*)[0-9]+/\1${NEW_CODE}/" "$GRADLE"
            sed -i -E "s/^([[:space:]]*versionName[[:space:]]*=[[:space:]]*)\"[^\"]*\"/\1\"${NEW_VER}\"/" "$GRADLE"
          fi
          grep -nE "^[[:space:]]*version(Code|Name)" "$GRADLE" | head

          # Авто-продвижение master на следующий patch после stable УБРАНО:
          # владелец сам управляет версией. bump_after_release всегда false.
          BUMP_AFTER="false"
          NEXT_VER="$NEW_VER"

          {
            echo "release_tag=$TAG"
            echo "prerelease=$PRE"
            echo "version=$NEW_VER"
            echo "version_code=$NEW_CODE"
            echo "bump_after_release=$BUMP_AFTER"
            echo "next_version=$NEXT_VER"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release"
            echo
            echo "- Tag: \`$TAG\`"
            echo "- Version: \`$NEW_VER\` (versionCode $NEW_CODE)"
            echo "- Channel: \`${CHANNEL:-explicit}\` -> prerelease=$PRE"
            if [ "$BUMP_AFTER" = "true" ]; then
              echo "- After publishing, master moves to the next development version: \`$NEXT_VER\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Will publish $TAG as version $NEW_VER (prerelease=$PRE, bump_after=$BUMP_AFTER -> $NEXT_VER)"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: "14742923"
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 \
            --install "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Restore cached libhevtun
        id: cache-libhevtun-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash compile-hevtun.sh

      - name: Save libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy libhevtun
        shell: bash
        run: |
          set -euo pipefail
          cp -r "${{ github.workspace }}/libs" "${{ github.workspace }}/V2rayNG/app"

      - name: Fetch AndroidLibXrayLite tag
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_TAG="$(git -C AndroidLibXrayLite describe --tags --abbrev=0 || true)"
          if [ -z "$CURRENT_TAG" ]; then
            echo "::warning::No tag in the pinned submodule; falling back to the latest upstream release."
            CURRENT_TAG="$(curl -fsSL --retry 3 \
              https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest \
              | jq -r '.tag_name')"
          fi
          if [ -z "$CURRENT_TAG" ] || [ "$CURRENT_TAG" = "null" ]; then
            echo "::error::Cannot determine AndroidLibXrayLite release tag."
            exit 1
          fi
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"
          echo "Using AndroidLibXrayLite tag: $CURRENT_TAG"

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.CURRENT_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Verify native libraries are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for f in V2rayNG/app/libs/libv2ray.aar; do
            if [ ! -f "$f" ]; then echo "::error::missing $f"; missing=1; fi
          done
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            for lib in libhev-socks5-tunnel.so libhevsockstun.so; do
              if [ ! -f "V2rayNG/app/libs/$abi/$lib" ]; then
                echo "::error::missing V2rayNG/app/libs/$abi/$lib"; missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All required native libraries are staged."

      - name: Setup Java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Go for sidecar engines
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false

      - name: Fetch and build sidecar engine binaries
        shell: bash
        env:
          MIHOMO_TAG: v1.19.33
          MIHOMO_SHA256: cfa0be78846bfef7272fe5a73089f8cf0e1f15a6ffb601f5cc809f457f712f67
          SINGBOX_TAG: v1.14.4
        run: |
          set -euo pipefail
          mkdir -p V2rayNG/app/src/main/assets/engines

          # mihomo: official prebuilt android-arm64 binary (AmneziaWG 3.x/1.x).
          curl -fsSL --retry 4 -o /tmp/mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_TAG}/mihomo-android-arm64-v8-${MIHOMO_TAG}.gz"
          gunzip -f /tmp/mihomo.gz
          # The pin covers the unpacked binary: gz wrappers differ per upload.
          echo "${MIHOMO_SHA256}  /tmp/mihomo" | sha256sum -c -
          install -m 0755 /tmp/mihomo V2rayNG/app/src/main/assets/engines/mihomo

          # sing-box: official releases ship no naive outbound, so build from
          # source with the documented tag; openconnect endpoint is in core.
          git clone --depth 1 --branch "${SINGBOX_TAG}" https://github.com/SagerNet/sing-box /tmp/sing-box
          cd /tmp/sing-box
          # The naive outbound imports cronet-go, whose android_arm64 package is
          # cgo-only: CGO_ENABLED=0 excludes all of its files. Cross-compile with
          # the NDK clang instead. gvisor is not needed (the sidecar runs without
          # a tun inbound), so keep the tag set minimal.
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 \
            CC="$NDK_BIN/aarch64-linux-android24-clang" \
            CXX="$NDK_BIN/aarch64-linux-android24-clang++" \
            go build -trimpath -buildvcs=false -tags with_naive_outbound \
            -ldflags="-s -w -X github.com/sagernet/sing-box/constant.Version=${SINGBOX_TAG}" \
            -o sing-box ./cmd/sing-box
          cd -
          install -m 0755 /tmp/sing-box/sing-box V2rayNG/app/src/main/assets/engines/sing-box

          # Mimic: Hysteria2-family transport (MTP + TLS mimicry) Go client,
          # cross-compiled here, never on the phone.
          git clone --depth 1 https://github.com/Locon213/Mimic-Protocol /tmp/mimic
          cd /tmp/mimic
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o mimic-client ./cmd/client
          cd -
          install -m 0755 /tmp/mimic/mimic-client V2rayNG/app/src/main/assets/engines/mimic-client

          ls -la V2rayNG/app/src/main/assets/engines/
          echo "## Sidecar engines" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sha256sum V2rayNG/app/src/main/assets/engines/* >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Download FPTN client (hard gate)
        uses: actions/download-artifact@v8
        with:
          name: fptn-client-arm64-v8a
          path: fptn-in

      - name: Bundle FPTN client into assets
        shell: bash
        env:
          FPTN_SHA256: ${{ needs.fptn.outputs.sha256 }}
          FPTN_SIZE: ${{ needs.fptn.outputs.size }}
        run: |
          set -euo pipefail
          # FPTN is a hard gate. The `fptn` job (reusable fptn-android workflow)
          # cross-compiles the client with Conan+NDK and uploads it; this step
          # refuses to proceed unless the binary is present, non-empty, matches
          # the producer's SHA256 and is a bionic arm64 ELF. There is no
          # continue-on-error fallback any more: a release without fptn-client
          # must fail, not ship a broken engine.
          SRC="fptn-in/fptn-client"
          if [ ! -f "$SRC" ]; then
            echo "::error::FPTN client artifact is missing (fptn-in/fptn-client)"
            ls -la fptn-in 2>/dev/null || true
            exit 1
          fi
          ACTUAL_SHA="$(sha256sum "$SRC" | cut -d' ' -f1)"
          ACTUAL_SIZE="$(stat -c%s "$SRC")"
          echo "fptn-client sha256=$ACTUAL_SHA size=$ACTUAL_SIZE"
          echo "expected    sha256=$FPTN_SHA256 size=$FPTN_SIZE"
          if [ -n "$FPTN_SHA256" ] && [ "$ACTUAL_SHA" != "$FPTN_SHA256" ]; then
            echo "::error::FPTN client checksum mismatch"; exit 1
          fi
          file "$SRC" | grep -qi "ELF" || { echo "::error::fptn-client is not an ELF"; exit 1; }
          file "$SRC" | grep -qiE "ARM aarch64|arm64" || { echo "::error::fptn-client is not arm64"; exit 1; }
          install -m 0755 "$SRC" V2rayNG/app/src/main/assets/engines/fptn-client
          echo "FPTN client bundled: $(sha256sum V2rayNG/app/src/main/assets/engines/fptn-client)"

      - name: Verify all sidecar engines are bundled
        shell: bash
        run: |
          set -euo pipefail
          # Hard gate: every engine the fork advertises must physically be in the
          # assets before any APK is built. This is what previously slipped by -
          # fptn-client was silently missing from shipped releases.
          D="V2rayNG/app/src/main/assets/engines"
          missing=0
          for e in mihomo sing-box mimic-client fptn-client; do
            if [ -f "$D/$e" ]; then
              printf '%s\n' "$D/$e: $(stat -c%s "$D/$e") bytes  $(sha256sum "$D/$e" | cut -c1-16)"
            else
              echo "::error::missing engine: $D/$e"; missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "## Bundled sidecar engines" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la "$D" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$D"/* >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Detect signing material
        id: signing
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        shell: bash
        run: |
          set -euo pipefail
          # Publisher policy: every release APK is signed with the owner's key.
          # A debug-signed build is allowed only for `release_channel=none` (the
          # build-and-test path, which publishes nothing). An explicit
          # release_tag on its own also counts as publish intent. Anything else
          # requires all four signing secrets to be present and accepted.
          # No keystore contents, alias, certificate subject or fingerprints are
          # ever printed: the keytool probe output goes to a deleted temp file.
          #
          # Signing secrets live only in the runner workspace, never committed:
          # the encoded keystore material exists only as `android_keystore.jks`.
          HAVE_ALL="false"
          if [ -n "${APP_KEYSTORE_BASE64:-}" ] && [ -n "${APP_KEYSTORE_PASSWORD:-}" ] \
             && [ -n "${APP_KEYSTORE_ALIAS:-}" ] && [ -n "${APP_KEY_PASSWORD:-}" ]; then
            printf '%s' "$APP_KEYSTORE_BASE64" | base64 -d > android_keystore.jks
            KEYTOOL="${JAVA_HOME}/bin/keytool"
            if [ -x "$KEYTOOL" ]; then
              if ! "$KEYTOOL" -list -v -alias "$APP_KEYSTORE_ALIAS" \
                    -keystore android_keystore.jks -storepass "$APP_KEYSTORE_PASSWORD" \
                    > /tmp/keycheck.txt 2>&1; then
                rm -f /tmp/keycheck.txt
                echo "::error::The supplied release keystore could not be opened with the chosen password/alias."
                exit 1
              fi
              rm -f /tmp/keycheck.txt
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "keystore=$PWD/android_keystore.jks" >> "$GITHUB_OUTPUT"
            HAVE_ALL="true"
            echo "Release keystore present and opened successfully."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$HAVE_ALL" != "true" ]; then
            case "${RELEASE_CHANNEL:-none}" in
              stable|prerelease)
                echo "::error::A ${RELEASE_CHANNEL} release was requested, but no valid owner's keystore was supplied. Required secrets: APP_KEYSTORE_BASE64, APP_KEYSTORE_PASSWORD, APP_KEY_PASSWORD, APP_KEYSTORE_ALIAS. Use release_channel=none to only build and test."
                exit 1
                ;;
            esac
            if [ -n "${RELEASE_TAG:-}" ]; then
              echo "::error::An explicit release tag was requested, but the owner's release keystore is incomplete or could not be opened."
              exit 1
            fi
          fi

      - name: Run unit tests
        id: tests
        working-directory: V2rayNG
        shell: bash
        run: |
          set -uo pipefail
          # Blocking on purpose. This step used to be `continue-on-error: true`
          # and ended with an unconditional `exit 0`, so a failing test suite
          # could never reach the job: the run stayed green and the release was
          # published anyway. That is the same class of bug as the old
          # best-effort FPTN step, which shipped releases with no fptn-client
          # inside while reporting success. A green run must mean a green build.
          #
          # /tmp/tests.log is kept because the "Report Gradle failure as
          # annotations" step parses it and surfaces the failing assertions as
          # annotations on the run page.
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:testPlaystoreDebugUnitTest --no-daemon --stacktrace 2>&1 | tee /tmp/tests.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Unit tests failed::Gradle exited $rc. See the test report and the annotations below."
            find app/build/reports/tests -name '*.html' 2>/dev/null | head -5
            grep -nE "^e: |FAILED|Test.*failed" /tmp/tests.log | head -40 || true
          fi
          exit "$rc"

      - name: Build APK
        id: buildapk
        working-directory: V2rayNG
        shell: bash
        env:
          IS_RELEASE: ${{ steps.signing.outputs.release }}
          KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew

          if [ "$IS_RELEASE" = "true" ]; then
            # Подпись выполняется через signingConfig "ownerRelease" в
            # build.gradle.kts, который читает те же переменные окружения
            # (KEYSTORE_FILE, APP_KEYSTORE_*). Именно signingConfig включает
            # ВСЕ четыре схемы v1/v2/v3/v4; механизм android.injected.signing.*
            # их не активирует, поэтому injected-свойства больше не передаём.
            ./gradlew :app:assemblePlaystoreRelease --no-daemon --stacktrace \
              2>&1 | tee /tmp/build.log
          else
            ./gradlew :app:assemblePlaystoreDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          fi
          rc=${PIPESTATUS[0]}
          echo "Gradle exit code: $rc"
          exit "$rc"

      - name: Report Gradle failure as annotations
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          : > /tmp/err.txt
          for f in /tmp/build.log /tmp/tests.log; do
            [ -f "$f" ] || continue
            {
              echo "=== $f ==="
              grep -nE "^e: |^w: .*(rror|nresolved)|FAILURE: |What went wrong|Execution failed|Caused by:|error: |> Task .* FAILED|BUILD FAILED|Could not resolve|Could not find|A problem occurred|tests? completed|FAILED$" "$f" | tail -50
              echo "--- tail 60 ---"
              tail -60 "$f"
            } >> /tmp/err.txt 2>&1 || true
          done
          if [ ! -s /tmp/err.txt ]; then
            echo "no gradle log captured" >> /tmp/err.txt
          fi
          n=0
          while IFS= read -r line; do
            n=$((n+1))
            [ "$n" -gt 60 ] && break
            safe=$(printf '%s' "$line" | sed 's/%/%25/g' | tr -d '\r' | cut -c1-450)
            echo "::error title=log-$n::${safe}"
          done < /tmp/err.txt
          echo "Emitted $n annotation lines from the Gradle logs."

      - name: Collect APKs
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.release }}" = "true" ]; then
            APK_DIR="V2rayNG/app/build/outputs/apk/playstore/release"
          else
            APK_DIR="V2rayNG/app/build/outputs/apk/playstore/debug"
          fi
          mkdir -p release-assets
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No APK files were produced."
            exit 1
          fi
          cp "${APKS[@]}" release-assets/
          # v4-подпись — отдельный sidecar-файл <apk>.idsig рядом с APK.
          # Собираем его, чтобы v4 была не только включена, но и доказуема.
          find "$APK_DIR" -maxdepth 1 -type f -name '*.idsig' -exec cp {} release-assets/ \; 2>/dev/null || true
          ( cd release-assets && sha256sum ./*.apk > SHA256SUMS.txt )
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
            V2rayNG/app/build.gradle.kts | head -n 1)"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          ls -la release-assets
          cat release-assets/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: v2rayNG-${{ steps.collect.outputs.version }}
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && steps.prepare.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_WRITE_TOKEN: ${{ secrets.REPO_WRITE_TOKEN }}
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
          IS_PRERELEASE: ${{ steps.prepare.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# v2rayNG ${RELEASE_VERSION} — сборка форка"
            echo
            if [ "$IS_PRERELEASE" = "true" ]; then
              echo "> **Предварительный выпуск (бета).** Ставьте только если включён"
              echo "> переключатель «Проверять предварительные версии» в разделе «Проверка обновлений»."
              echo
            fi
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Канал: $([ "$IS_PRERELEASE" = "true" ] && echo 'предварительная бета' || echo 'стабильная')"
            echo "- Подпись: $([ "${{ steps.signing.outputs.release }}" = "true" ] && echo "релизный ключ владельца" || echo "отладочная")"
            echo
            echo "## Контрольные суммы (SHA-256)"
            echo '```'
            cat release-assets/SHA256SUMS.txt
            echo '```'
          } > release-notes.md

          # ---- Changelog for THIS release only ----
          # A token is required to list releases; REPO_WRITE_TOKEN has wider scope.
          export GH_TOKEN="${REPO_WRITE_TOKEN:-${GITHUB_TOKEN:-}}"
          git fetch --tags --force origin >/dev/null 2>&1 || true

          # Previous release by PUBLICATION TIME, never by tag-name sort: sorting
          # names as text picks the wrong neighbour and every changelog then
          # repeats the same commit range.
          PREV_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,publishedAt \
            --jq '[.[] | select(.tagName != env.RELEASE_TAG)] | sort_by(.publishedAt) | last | .tagName // ""' \
            2>/dev/null || true)"
          if [ -n "$PREV_TAG" ] && ! git rev-parse -q --verify \
              "refs/tags/${PREV_TAG}^{commit}" >/dev/null 2>&1; then
            PREV_TAG=""
          fi
          echo "Предыдущий релиз: ${PREV_TAG:-отсутствует}"

          {
            echo
            echo "## Что изменилось в этом выпуске"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "Коммиты с предыдущего опубликованного выпуска \`${PREV_TAG}\`:"
              echo
              RANGE_LOG="$(git log --no-merges --date=short \
                --pretty=format:'- %s (%h, %ad)' "${PREV_TAG}..HEAD" 2>/dev/null || true)"
            else
              echo "Предыдущий выпуск не найден. Последние 20 коммитов:"
              echo
              RANGE_LOG="$(git log --no-merges -n 20 --date=short \
                --pretty=format:'- %s (%h, %ad)' HEAD 2>/dev/null || true)"
            fi
            if [ -n "$RANGE_LOG" ]; then printf '%s\n' "$RANGE_LOG"; else echo "- Новых коммитов нет."; fi
          } >> release-notes.md

          GH_FLAGS=(--repo "$GITHUB_REPOSITORY"
                    --title "v2rayNG ${RELEASE_VERSION} — сборка форка"
                    --notes-file release-notes.md
                    --target "$GITHUB_SHA")
          if [ "$IS_PRERELEASE" = "true" ]; then
            # Upstream convention: the in-development build is published as a
            # GitHub prerelease, so `/releases/latest` keeps pointing at the last
            # stable build and the app's pre-release switch has something to find.
            GH_FLAGS+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release-assets/* "${GH_FLAGS[@]}" 2>&1 | tee /tmp/release.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || exit "$rc"

          # Mark Latest explicitly, but ONLY for a stable release. Setting
          # make_latest on a prerelease would move GitHub's "Latest" pointer onto
          # a beta, which is exactly the ordering bug we just fixed: /releases is
          # sorted by created_at while /releases/latest honours the flag.
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')"
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "Prerelease published; leaving the Latest pointer on the stable release."
          elif [ -n "${release_id:-}" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/${release_id}" \
              -f make_latest=true > /dev/null || true
            echo "Marked $RELEASE_TAG as Latest."
          fi

      - name: Commit the release version to master
        # The version bump lives only in the runner's working tree, so without
        # this step the next run would read the OLD versionName and collide on the
        # tag. Committing keeps master in sync with the published APK.
        #
        # For a STABLE release with no explicit bump, master then advances to the
        # next patch version, opening the next development cycle (upstream release
        # train): the just-published stable stays the "Latest" release, while new
        # betas built from master carry the higher version and are offered to users
        # who enabled pre-releases.
        #
        # Both commits are authored as github-actions[bot]; the `build` job guard
        # skips bot-authored pushes, so this does not start a second build loop.
        if: success() && steps.prepare.outputs.release_tag != '' && steps.prepare.outputs.version != ''
        env:
          REPO_WRITE_TOKEN: ${{ secrets.REPO_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          GRADLE="V2rayNG/app/build.gradle.kts"
          NEW_VER="${{ steps.prepare.outputs.version }}"
          NEW_CODE="${{ steps.prepare.outputs.version_code }}"
          TAG="${{ steps.prepare.outputs.release_tag }}"
          BUMP_AFTER="${{ steps.prepare.outputs.bump_after_release }}"
          NEXT_VER="${{ steps.prepare.outputs.next_version }}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$GRADLE"
          if ! git diff --cached --quiet; then
            git commit -m "chore(version): установить версию ${NEW_VER} (${NEW_CODE}) для ${TAG}"
          else
            echo "Release version already committed."
          fi

          if [ "$BUMP_AFTER" = "true" ] && [ -n "$NEXT_VER" ]; then
            NEXT_CODE=$((NEW_CODE + 1))
            sed -i -E "s/^([[:space:]]*versionCode[[:space:]]*=[[:space:]]*)[0-9]+/\1${NEXT_CODE}/" "$GRADLE"
            sed -i -E "s/^([[:space:]]*versionName[[:space:]]*=[[:space:]]*)\"[^\"]*\"/\1\"${NEXT_VER}\"/" "$GRADLE"
            git add "$GRADLE"
            git commit -m "chore(version): начать новый цикл разработки ${NEXT_VER} (${NEXT_CODE})"
          fi

          if [ -n "${REPO_WRITE_TOKEN:-}" ]; then
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$REPO_WRITE_TOKEN" | base64 -w0)" \
              push origin "HEAD:refs/heads/master"
          else
            git push origin "HEAD:refs/heads/master"
          fi
          echo "Published version state to master."
