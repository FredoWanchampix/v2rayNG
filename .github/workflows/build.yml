name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel to publish"
        required: false
        type: choice
        default: "none"
        options:
          - none
          - stable
          - prerelease
      version_bump:
        description: "Version bump (prerelease: bump makes the beta newer than stable; stable: keep none to publish current, then master auto-advances)"
        required: false
        type: choice
        default: "none"
        options:
          - none
          - patch
          - minor
          - major
      release_tag:
        description: "Optional explicit release tag (overrides channel naming)"
        required: false
        type: string

# Dispatch-only on purpose. This workflow used to also run on every push to
# master, which produced a second full APK build alongside whatever else touched
# the same commit (a manual sync, or a second dispatch) - the "two nearly
# identical builds" in the Actions list. Builds now happen ONLY when explicitly
# requested:
#   release_channel=stable     -> publish a stable release (moves Latest)
#   release_channel=prerelease -> publish a beta (prerelease flag)
#   release_channel=none       -> build + run tests to verify, publish nothing
# Nothing builds automatically on push any more.

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # FPTN is a hard gate: the APK must not be produced unless the FPTN client was
  # really cross-compiled for Android. It lives in a separate job because its
  # Conan+NDK build is slow and independent of the Gradle build.
  fptn:
    uses: ./.github/workflows/fptn-android-probe.yml
    with:
      fptn_tag: "0.4.6"

  # dnsproxy - hard gate, как и FPTN. Это DNS-форвардер (AdGuardTeam, Apache-2.0),
  # который нужен для измерения FPTN-профилей в изолированном netns: внутри netns
  # системный resolver Android возвращает fake-IP активного VPN, поэтому запросы
  # идут через локальный dnsproxy на upstream из настроек пользователя (udp/tcp/
  # tls/https/quic). Собирается в ОТДЕЛЬНОМ reusable-workflow со своей версией Go
  # (1.26.8), чтобы не затрагивать Go 1.25 для sing-box/mimic в этом файле.
  dnsproxy:
    uses: ./.github/workflows/dnsproxy-android-build.yml

  # speedprobe - hard gate. Собственный измеритель скорости на чистом Go (stdlib),
  # нужен для проверки FPTN-профилей в изолированном netns. Заменяет системный
  # curl, которого нет на части устройств (curl не входит в toybox и появился
  # только с Android 8.0, а minSdk приложения - 24). См. tools/speedprobe.
  speedprobe:
    uses: ./.github/workflows/speedprobe-android-build.yml

  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    needs: [fptn, dnsproxy, speedprobe]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare release version and tag
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          # Release channels mirror upstream 2dust/v2rayNG, where master carries the
          # NEXT version and the in-development build is published as a GitHub
          # *prerelease* (their 2.4.0 was a prerelease while 2.3.15 was the stable
          # Latest). The app then picks a channel:
          #   "Check pre-release versions" OFF -> /releases/latest, which GitHub
          #       resolves to the newest non-draft, non-prerelease release;
          #   ON -> /releases, newest by published_at, betas included.
          #
          # For the switch to mean anything, a beta must carry a HIGHER dotted
          # version than the stable build the user has installed: the app compares
          # only the dotted prefix of the tag (v2.4.1-beta.2026... -> 2.4.1) and
          # offers an update only when it is greater. That is why publishing a
          # stable release bumps master to the next patch afterwards, opening the
          # next development cycle - exactly the upstream release train.
          CHANNEL="${{ inputs.release_channel || 'none' }}"
          BUMP="${{ inputs.version_bump || 'none' }}"
          EXPLICIT_TAG="${{ inputs.release_tag || '' }}"
          GRADLE="V2rayNG/app/build.gradle.kts"

          CUR_VER="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$GRADLE" | head -n1)"
          CUR_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9]*\).*/\1/p' "$GRADLE" | head -n1)"
          [ -n "$CUR_VER" ] || { echo "::error::cannot read versionName"; exit 1; }
          [ -n "$CUR_CODE" ] || { echo "::error::cannot read versionCode"; exit 1; }
          echo "Current version in master: $CUR_VER (versionCode $CUR_CODE)"

          bump_version() {
            # POSIX read from a here-doc rather than bash's `<<<` herestring, so
            # the same snippet can be exercised under plain sh.
            local v="$1" how="$2" a b c
            IFS=. read -r a b c <<EOF
          $v
          EOF
            case "$how" in
              major) echo "$((a + 1)).0.0" ;;
              minor) echo "$a.$((b + 1)).0" ;;
              patch) echo "$a.$b.$((c + 1))" ;;
              *)     echo "$v" ;;
            esac
          }

          # No channel and no explicit tag: plain push build, publish nothing.
          if [ "$CHANNEL" = "none" ] && [ -z "$EXPLICIT_TAG" ]; then
            {
              echo "release_tag="
              echo "prerelease=false"
              echo "version=$CUR_VER"
              echo "version_code=$CUR_CODE"
              echo "bump_after_release=false"
            } >> "$GITHUB_OUTPUT"
            echo "No release channel selected: building without publishing."
            exit 0
          fi

          # Версия и номер сборки меняются ТОЛЬКО по явной команде владельца.
          # Владелец ведёт нумерацию по апстриму 2dust и сам решает, когда её
          # поднять. Автоматический bump patch-уровня для беты УБРАН: он молча
          # поднимал versionName/versionCode выше апстрима. Теперь:
          #   version_bump=none  -> версия берётся как есть из build.gradle.kts;
          #   version_bump=patch/minor/major -> явный выбор владельца при запуске.
          EFFECTIVE_BUMP="$BUMP"
          NEW_VER="$(bump_version "$CUR_VER" "$EFFECTIVE_BUMP")"
          if [ "$EFFECTIVE_BUMP" = "none" ]; then
            NEW_CODE="$CUR_CODE"
          else
            NEW_CODE=$((CUR_CODE + 1))
          fi

          if [ -n "$EXPLICIT_TAG" ]; then
            TAG="$EXPLICIT_TAG"
            # An explicit tag decides its own channel from its name, so
            # v1.2.3-beta.1 is still published as a prerelease.
            PRE="false"
            case "$EXPLICIT_TAG" in
              *beta*|*alpha*|*rc*|*-pre*) PRE="true" ;;
            esac
            # The built APK must report the SAME version as the tag it is
            # published under. Otherwise versionName stays at the old value, the
            # app's compareVersions() sees no difference and the release can never
            # be offered as an update - which is exactly the bug that made the
            # "check pre-release versions" switch look dead.
            TAG_VER="$(printf '%s' "$TAG" | sed -e 's/^v//' -e 's/-.*$//')"
            if printf '%s' "$TAG_VER" | grep -qE '^[0-9]+(\.[0-9]+)+$'; then
              NEW_VER="$TAG_VER"
            else
              echo "::error::Cannot read a dotted version out of tag '${TAG}' (got '${TAG_VER}'). Use e.g. v2.4.1 or v2.4.1-beta.1."
              exit 1
            fi
          elif [ "$CHANNEL" = "prerelease" ]; then
            TAG="v${NEW_VER}-beta.$(date -u +%Y%m%d-%H%M%S)"
            PRE="true"
          else
            TAG="v${NEW_VER}"
            PRE="false"
          fi

          # Refuse to clobber an existing tag: that would silently overwrite a
          # published release instead of failing loudly.
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Choose version_bump=patch/minor/major to publish a new version."
            exit 1
          fi

          # Версию в build.gradle.kts правим ТОЛЬКО при явном bump, выбранном
          # владельцем в этом запуске. При version_bump=none файл не трогаем:
          # APK получает ровно ту версию, что зафиксировал владелец в master.
          if [ "$EFFECTIVE_BUMP" != "none" ]; then
            sed -i -E "s/^([[:space:]]*versionCode[[:space:]]*=[[:space:]]*)[0-9]+/\1${NEW_CODE}/" "$GRADLE"
            sed -i -E "s/^([[:space:]]*versionName[[:space:]]*=[[:space:]]*)\"[^\"]*\"/\1\"${NEW_VER}\"/" "$GRADLE"
          fi
          grep -nE "^[[:space:]]*version(Code|Name)" "$GRADLE" | head

          # Авто-продвижение master на следующий patch после stable УБРАНО:
          # владелец сам управляет версией. bump_after_release всегда false.
          BUMP_AFTER="false"
          NEXT_VER="$NEW_VER"

          {
            echo "release_tag=$TAG"
            echo "prerelease=$PRE"
            echo "version=$NEW_VER"
            echo "version_code=$NEW_CODE"
            echo "bump_after_release=$BUMP_AFTER"
            echo "next_version=$NEXT_VER"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release"
            echo
            echo "- Tag: \`$TAG\`"
            echo "- Version: \`$NEW_VER\` (versionCode $NEW_CODE)"
            echo "- Channel: \`${CHANNEL:-explicit}\` -> prerelease=$PRE"
            if [ "$BUMP_AFTER" = "true" ]; then
              echo "- After publishing, master moves to the next development version: \`$NEXT_VER\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Will publish $TAG as version $NEW_VER (prerelease=$PRE, bump_after=$BUMP_AFTER -> $NEXT_VER)"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: "14742923"
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 \
            --install "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Restore cached libhevtun
        id: cache-libhevtun-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash compile-hevtun.sh

      - name: Save libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy libhevtun
        shell: bash
        run: |
          set -euo pipefail
          cp -r "${{ github.workspace }}/libs" "${{ github.workspace }}/V2rayNG/app"

      # libv2ray.aar берётся из ФОРКА владельца, а не из upstream 2dust.
      # Причина (вещдок 20.11.2026): нативная fetchQuicCertSha256 делала чистое
      # QUIC-рукопожатие без обфускации, поэтому ВСЕ Hysteria2-профили с
      # obfs=salamander/gecko получали «context deadline exceeded» (21 из 21
      # отказа против 4 из 4 успеха у профилей без obfs). Форк передаёт
      # obfs/obfsPassword/min-max из профиля и применяет их кодом самого
      # xray-core (transport/internet/finalmask/salamander), то есть байт-в-байт
      # как это делает ядро при работе профиля. Серверы провайдеров при этом
      # менять НЕ нужно.
      #
      # Тег задан ЯВНО: submodule AndroidLibXrayLite указывает на upstream
      # (2dust), поэтому `git -C AndroidLibXrayLite describe --tags` вернул бы
      # тег БЕЗ поддержки obfs, и фикс молча не попал бы в APK.
      - name: Set libv2ray source (fork with QUIC obfs support)
        shell: bash
        run: |
          set -euo pipefail
          echo "LIBV2RAY_REPO=FredoWanchampix/AndroidLibXrayLite" >> "$GITHUB_ENV"
          echo "CURRENT_TAG=v26.11.9-obfs.1" >> "$GITHUB_ENV"
          echo "Using libv2ray from FredoWanchampix/AndroidLibXrayLite @ v26.11.9-obfs.1"

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: ${{ env.LIBV2RAY_REPO }}
          tag: ${{ env.CURRENT_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Verify native libraries are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for f in V2rayNG/app/libs/libv2ray.aar; do
            if [ ! -f "$f" ]; then echo "::error::missing $f"; missing=1; fi
          done
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            for lib in libhev-socks5-tunnel.so libhevsockstun.so; do
              if [ ! -f "V2rayNG/app/libs/$abi/$lib" ]; then
                echo "::error::missing V2rayNG/app/libs/$abi/$lib"; missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All required native libraries are staged."

      # ТРЕБОВАНИЕ ВЛАДЕЛЬЦА: клиент выпускает 5 APK — по одному на каждую из
      # 4 ABI (arm64-v8a, armeabi-v7a, x86, x86_64) плюс universal со всеми
      # четырьмя .so монолитно. libgojni.so берётся из libv2ray.aar, поэтому
      # здесь проверяется, что aar содержит ВСЕ ЧЕТЫРЕ архитектуры, каждая .so
      # — валидный ELF нужной машины, и что aar собран именно из форка с
      # поддержкой obfs (маркер в бинарнике). Провал гейта останавливает сборку:
      # universal-APK без одной из архитектур дал бы UnsatisfiedLinkError в
      # рантайме, а aar без obfs молча вернул бы прежний баг с сертификатами.
      - name: Verify libv2ray.aar has all four ABIs and obfs support
        shell: bash
        run: |
          set -euo pipefail
          AAR="V2rayNG/app/libs/libv2ray.aar"
          echo "Checking $AAR ($(stat -c%s "$AAR") bytes)"
          rm -rf /tmp/aarcheck && mkdir -p /tmp/aarcheck
          unzip -q -o "$AAR" -d /tmp/aarcheck

          failed=0
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            so="/tmp/aarcheck/jni/$abi/libgojni.so"
            if [ ! -f "$so" ]; then
              echo "::error::libv2ray.aar: ОТСУТСТВУЕТ jni/$abi/libgojni.so"
              failed=1
              continue
            fi
            # ELF-заголовок: e_machine — 2 байта на смещении 18 (little-endian)
            machine="$(od -An -tu2 -j18 -N2 "$so" | tr -d ' ')"
            case "$abi" in
              armeabi-v7a) want=40;  wname="ARM" ;;
              arm64-v8a)   want=183; wname="AArch64" ;;
              x86)         want=3;   wname="Intel 80386" ;;
              x86_64)      want=62;  wname="x86-64" ;;
            esac
            size="$(stat -c%s "$so")"
            echo "  $abi: ${size} bytes, e_machine=${machine} (want ${want} = ${wname})"
            if [ "$machine" != "$want" ]; then
              echo "::error::libv2ray.aar: $abi e_machine=${machine}, ожидалось ${want} (${wname})"
              failed=1
            fi
          done

          # geo-данные обязательны (клиент их использует из assets aar)
          for dat in geoip.dat geosite.dat geoip-only-cn-private.dat; do
            if [ ! -f "/tmp/aarcheck/assets/$dat" ]; then
              echo "::error::libv2ray.aar: ОТСУТСТВУЕТ assets/$dat"; failed=1
            fi
          done

          # Маркер обфускации: доказывает, что взят aar ФОРКА, а не upstream
          marker_found=0
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            so="/tmp/aarcheck/jni/$abi/libgojni.so"
            [ -f "$so" ] || continue
            if python3 -c "import sys; sys.exit(0 if b'unsupported obfs type' in open(sys.argv[1],'rb').read() else 1)" "$so"; then
              marker_found=$((marker_found+1))
            else
              echo "::error::libv2ray.aar: $abi — маркер obfs-поддержки НЕ найден (взят upstream-без obfs?)"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::ГЕЙТ ПРОВАЛЕН: libv2ray.aar непригоден (нет 4 ABI и/или нет obfs)"
            exit 1
          fi
          echo "ГЕЙТ ПРОЙДЕН: 4/4 ABI валидны (e_machine), geo-данные на месте, obfs-маркер найден в ${marker_found}/4 .so."

      - name: Setup Java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # Бандлинг всех сайдкар-движков вынесен в ОДНО composite-действие.
      #
      # Зачем: build.yml и build-upstream-master.yml содержали собственные копии
      # этих шагов, и они уже разошлись - sync-workflow бандлил только четыре
      # движка (без dnsproxy и speedprobe), то есть APK из sync-сборки и из
      # release-сборки получались несовместимыми. Общее действие делает
      # расхождение невозможным в принципе.
      #
      # Движки укладываются в V2rayNG/app/libs/<abi>/lib*.so, откуда gradle
      # (jniLibs.srcDirs("libs")) кладёт их в lib/<abi>/ APK, а установщик
      # извлекает в nativeLibraryDir. Исполнение из filesDir на Android 10+
      # запрещено SELinux, поэтому assets/engines больше не используется.
      - name: Bundle sidecar engines (all ABIs)
        id: engines
        uses: ./.github/actions/bundle-sidecar-engines
        with:
          ndk_home: ${{ env.ANDROID_NDK_HOME }}
          fptn_sha256: ${{ needs.fptn.outputs.sha256 }}
          dnsproxy_sha256_arm64: ${{ needs.dnsproxy.outputs.sha256 }}
          speedprobe_sha256_arm64: ${{ needs.speedprobe.outputs.sha256 }}

      - name: Detect signing material
        id: signing
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        shell: bash
        run: |
          set -euo pipefail
          # Publisher policy: every release APK is signed with the owner's key.
          # A debug-signed build is allowed only for `release_channel=none` (the
          # build-and-test path, which publishes nothing). An explicit
          # release_tag on its own also counts as publish intent. Anything else
          # requires all four signing secrets to be present and accepted.
          # No keystore contents, alias, certificate subject or fingerprints are
          # ever printed: the keytool probe output goes to a deleted temp file.
          #
          # Signing secrets live only in the runner workspace, never committed:
          # the encoded keystore material exists only as `android_keystore.jks`.
          HAVE_ALL="false"
          if [ -n "${APP_KEYSTORE_BASE64:-}" ] && [ -n "${APP_KEYSTORE_PASSWORD:-}" ] \
             && [ -n "${APP_KEYSTORE_ALIAS:-}" ] && [ -n "${APP_KEY_PASSWORD:-}" ]; then
            printf '%s' "$APP_KEYSTORE_BASE64" | base64 -d > android_keystore.jks
            KEYTOOL="${JAVA_HOME}/bin/keytool"
            if [ -x "$KEYTOOL" ]; then
              if ! "$KEYTOOL" -list -v -alias "$APP_KEYSTORE_ALIAS" \
                    -keystore android_keystore.jks -storepass "$APP_KEYSTORE_PASSWORD" \
                    > /tmp/keycheck.txt 2>&1; then
                rm -f /tmp/keycheck.txt
                echo "::error::The supplied release keystore could not be opened with the chosen password/alias."
                exit 1
              fi
              rm -f /tmp/keycheck.txt
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "keystore=$PWD/android_keystore.jks" >> "$GITHUB_OUTPUT"
            HAVE_ALL="true"
            echo "Release keystore present and opened successfully."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$HAVE_ALL" != "true" ]; then
            case "${RELEASE_CHANNEL:-none}" in
              stable|prerelease)
                echo "::error::A ${RELEASE_CHANNEL} release was requested, but no valid owner's keystore was supplied. Required secrets: APP_KEYSTORE_BASE64, APP_KEYSTORE_PASSWORD, APP_KEY_PASSWORD, APP_KEYSTORE_ALIAS. Use release_channel=none to only build and test."
                exit 1
                ;;
            esac
            if [ -n "${RELEASE_TAG:-}" ]; then
              echo "::error::An explicit release tag was requested, but the owner's release keystore is incomplete or could not be opened."
              exit 1
            fi
          fi

      - name: Run unit tests
        id: tests
        working-directory: V2rayNG
        shell: bash
        run: |
          set -uo pipefail
          # Blocking on purpose. This step used to be `continue-on-error: true`
          # and ended with an unconditional `exit 0`, so a failing test suite
          # could never reach the job: the run stayed green and the release was
          # published anyway. That is the same class of bug as the old
          # best-effort FPTN step, which shipped releases with no fptn-client
          # inside while reporting success. A green run must mean a green build.
          #
          # /tmp/tests.log is kept because the "Report Gradle failure as
          # annotations" step parses it and surfaces the failing assertions as
          # annotations on the run page.
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:testPlaystoreDebugUnitTest --no-daemon --stacktrace 2>&1 | tee /tmp/tests.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Unit tests failed::Gradle exited $rc. See the test report and the annotations below."
            find app/build/reports/tests -name '*.html' 2>/dev/null | head -5
            grep -nE "^e: |FAILED|Test.*failed" /tmp/tests.log | head -40 || true
          fi
          exit "$rc"

      - name: Build APK
        id: buildapk
        working-directory: V2rayNG
        shell: bash
        env:
          IS_RELEASE: ${{ steps.signing.outputs.release }}
          KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew

          if [ "$IS_RELEASE" = "true" ]; then
            # Подпись выполняется через signingConfig "ownerRelease" в
            # build.gradle.kts, который читает те же переменные окружения
            # (KEYSTORE_FILE, APP_KEYSTORE_*). Именно signingConfig включает
            # ВСЕ четыре схемы v1/v2/v3/v4; механизм android.injected.signing.*
            # их не активирует, поэтому injected-свойства больше не передаём.
            ./gradlew :app:assemblePlaystoreRelease --no-daemon --stacktrace \
              2>&1 | tee /tmp/build.log
          else
            ./gradlew :app:assemblePlaystoreDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          fi
          rc=${PIPESTATUS[0]}
          echo "Gradle exit code: $rc"
          exit "$rc"

      - name: Report Gradle failure as annotations
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          # Раньше этот шаг выдавал до 60 ОТДЕЛЬНЫХ ::error-аннотаций, из-за чего
          # страница упавшей сборки превращалась в стену красных блоков log-1..log-60,
          # а настоящую причину приходилось искать глазами. Теперь:
          #   1. ОДНА сводная аннотация с первыми строками реальной причины;
          #   2. полный разбор - в сворачиваемом блоке job summary (читается удобно,
          #      аннотации не засоряет).
          : > /tmp/err.txt
          for f in /tmp/build.log /tmp/tests.log; do
            [ -f "$f" ] || continue
            {
              echo "=== $f ==="
              grep -nE "^e: |FAILURE: |What went wrong|Execution failed|Caused by:|error: |> Task .* FAILED|BUILD FAILED|Could not resolve|Could not find|A problem occurred|tests? completed|FAILED$" "$f" | tail -80
              echo "--- tail 60 ---"
              tail -60 "$f"
            } >> /tmp/err.txt 2>&1 || true
          done
          if [ ! -s /tmp/err.txt ]; then
            echo "no gradle log captured" >> /tmp/err.txt
          fi

          # В summary: полный разбор под раскрывающимся заголовком.
          {
            echo "## Причина падения сборки"
            echo
            echo "<details><summary>Разбор логов Gradle (нажмите, чтобы раскрыть)</summary>"
            echo
            echo '```'
            head -c 60000 /tmp/err.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          # Одна аннотация вместо стены из 60. Берём ПЕРВУЮ настоящую причину из
          # сообщений компилятора/Gradle: без "tail 60" и без дублей, которые и
          # создавали шум. Полный разбор уже записан в job summary выше.
          ROOT_CAUSE="$(grep -E "^e: |FAILURE: |Caused by:|> Task .* FAILED|BUILD FAILED|Could not resolve|Could not find" /tmp/err.txt \
            | sed -E 's#file:///home/runner/work/[^ ]*/##' | head -1)"
          if [ -z "$ROOT_CAUSE" ]; then
            ROOT_CAUSE="$(tail -1 /tmp/err.txt)"
          fi
          FAILING="$(grep -cE "^e: |FAILED|BUILD FAILED" /tmp/err.txt 2>/dev/null || echo 0)"
          # Аннотация строго однострочная: percent экранируется в %25 (требование
          # workflow-команд GitHub), возвраты каретки и переводы строк вырезаются.
          SAFE="$(printf '%s' "$ROOT_CAUSE" | tr -d '\r\n' | sed -e 's/%/%25/g' | cut -c1-400)"
          echo "::error title=Gradle failure (${FAILING} error lines, details in summary)::${SAFE}"

      - name: Verify APK signing schemes (v1+v2+v3+v4)
        if: steps.signing.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Авторитетная проверка подписи официальным apksigner из build-tools.
          #
          # ВАЖНО про v4: подпись схемы v4 физически НЕ хранится внутри APK —
          # это парный sidecar-файл <apk>.idsig. Без явного --v4-signature-file
          # apksigner сообщает v4:false даже для корректно подписанного APK.
          # Аналогично v1: при minSdk>=24 apksigner по умолчанию не требует
          # JAR-подпись и печатает v1:false, хотя MANIFEST.MF/CERT.SF/CERT.RSA
          # присутствуют. Поэтому проверяем так, как это делают установщик и
          # пользовательские инструменты владельца (apktool ищет .idsig рядом
          # с APK): --min-sdk-version 21 и явный --v4-signature-file.
          #
          # В логи печатаются ТОЛЬКО булевы флаги схем; DN сертификата,
          # отпечатки и --print-certs не выводятся намеренно.
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          [ -x "$APKSIGNER" ] || { echo "::error::apksigner не найден: $APKSIGNER"; exit 1; }
          APK_DIR="V2rayNG/app/build/outputs/apk/playstore/release"
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | sort)
          [ "${#APKS[@]}" -gt 0 ] || { echo "::error::нет APK для проверки"; exit 1; }
          {
            echo "## Проверка подписи (apksigner: v1+v2+v3+v4)"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for apk in "${APKS[@]}"; do
            base="$(basename "$apk")"
            if [ ! -f "$apk.idsig" ]; then
              echo "::error::$base: отсутствует парный v4-файл .idsig"; fail=1; continue
            fi
            out="$("$APKSIGNER" verify --verbose --min-sdk-version 21 \
                     --v4-signature-file "$apk.idsig" "$apk" 2>&1 \
              | grep -E "^(Verifies|Verified using v[1-4] scheme|Number of signers)" || true)"
            echo "$base:"
            echo "$out" | sed 's/^/  /'
            { echo "$base:"; echo "$out" | sed 's/^/  /'; } >> "$GITHUB_STEP_SUMMARY"
            for v in v1 v2 v3 v4; do
              if echo "$out" | grep -q "Verified using $v scheme.*: true"; then :; else
                echo "::error::$base: схема $v НЕ подтверждена apksigner"; fail=1
              fi
            done
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$fail" -ne 0 ]; then
            echo "::error::Проверка подписи провалена: требуются схемы v1+v2+v3+v4 у каждого APK."
            exit 1
          fi
          echo "Все APK подписаны владельческим ключом: v1+v2+v3 внутри APK, v4 — парный .idsig."

      - name: Collect APKs
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.release }}" = "true" ]; then
            APK_DIR="V2rayNG/app/build/outputs/apk/playstore/release"
          else
            APK_DIR="V2rayNG/app/build/outputs/apk/playstore/debug"
          fi
          mkdir -p release-assets
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No APK files were produced."
            exit 1
          fi
          cp "${APKS[@]}" release-assets/
          # v4-подпись — парный sidecar-файл <apk>.idsig. Копируем рядом с APK.
          find "$APK_DIR" -maxdepth 1 -type f -name '*.idsig' -exec cp {} release-assets/ \; 2>/dev/null || true
          ( cd release-assets && sha256sum ./*.apk > SHA256SUMS.txt )
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
            V2rayNG/app/build.gradle.kts | head -n 1)"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          ls -la release-assets
          cat release-assets/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifacts (all in one)
        uses: actions/upload-artifact@v7
        with:
          name: v2rayNG-${{ steps.collect.outputs.version }}
          path: release-assets/*
          if-no-files-found: error

      # ------------------------------------------------------------------
      # Требование владельца: общий артефакт (~700 МБ, все APK разом) остаётся,
      # НО каждая архитектура дополнительно публикуется ОТДЕЛЬНЫМ артефактом —
      # чтобы не тянуть 700 МБ ради одного APK своего устройства. Разбивка
      # выполняется на КАЖДОЙ сборке (в том числе release_channel=none), а не
      # только при публикации релиза.
      #
      # В артефакт ABI кладётся: сам APK, парный .idsig (v4-подпись — без него
      # APK не установить инкрементально и не проверить apksigner'ом) и
      # SHA256SUMS.txt именно этого файла (тот же формат, что в релизе:
      # "<hex>  ./<имя>", чтобы файл можно было сверить командой sha256sum -c).
      # universal попадает в список ABI наравне с остальными — это «все слои»
      # одним файлом, и владельцу он тоже нужен отдельно.
      # ------------------------------------------------------------------
      - name: Split APKs per ABI
        id: split
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact-per-abi
          mkdir -p artifact-per-abi
          # Список ABI, которые РЕАЛЬНО собраны (а не захардкоженный): сборка
          # может идти с ABI_FILTERS и произвести лишь часть архитектур.
          found=0
          for apk in release-assets/*.apk; do
            [ -e "$apk" ] || continue
            base="$(basename "$apk" .apk)"
            # ABI определяется СУФФИКСОМ имени файла по известному списку, а не
            # «последним сегментом после '_'». Последний сегмент НЕЛЬЗЯ брать:
            # имя x86_64 само содержит подчёркивание (v2rayNG_2.4.2_x86_64), и
            # ${base##*_} дал бы «64» — шаг упал бы на каждой сборке.
            # Порядок перечисления важен: сначала более длинные имена
            # (armeabi-v7a, arm64-v8a, x86_64), иначе «x86» матчится раньше
            # «x86_64» как его подстрока.
            abi=""
            for candidate in armeabi-v7a arm64-v8a x86_64 x86 universal; do
              case "$base" in
                *"_${candidate}") abi="$candidate"; break ;;
              esac
            done
            if [ -z "$abi" ]; then
              echo "::error::Не удалось определить ABI из имени '$base'"
              echo "::error::Ожидался суффикс из: armeabi-v7a arm64-v8a x86_64 x86 universal"
              exit 1
            fi
            dir="artifact-per-abi/$abi"
            mkdir -p "$dir"
            # ЖЁСТКИЕ ССЫЛКИ вместо копирования: общий артефакт весит ~720 МБ,
            # и его копия удвоила бы расход диска раннера и добавила бы десятки
            # секунд на каждую сборку. cp -l не расходует место вообще, а
            # upload-artifact читает содержимое одинаково. Откат на обычное cp —
            # на случай файловой системы без жёстких ссылок.
            cp -l "$apk" "$dir/" 2>/dev/null || cp "$apk" "$dir/"
            # Парный файл v4-подписи, если он есть (релизные сборки).
            if [ -f "$apk.idsig" ]; then
              cp -l "$apk.idsig" "$dir/" 2>/dev/null || cp "$apk.idsig" "$dir/"
            fi
            # Персональный манифест хэша: тот же формат, что общий SHA256SUMS.txt
            # ("<hex>  ./<имя>", чтобы файл проверялся командой sha256sum -c).
            # ГЛОБ НЕ В КАВЫЧКАХ: shell не раскрывает шаблоны внутри двойных
            # кавычек, и sha256sum получил бы литеральное имя "./*.apk".
            ( cd "$dir" && sha256sum ./*.apk > SHA256SUMS.txt )
            found=$((found+1))
            echo "  $abi: $(du -h "$dir/$(basename "$apk")" | cut -f1)"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::Не найдено ни одного APK для разбивки по ABI."
            exit 1
          fi
          echo "count=$found" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "## Артефакты по архитектурам ($found шт.)"
            echo
            echo '| ABI | APK | SHA-256 |'
            echo '|---|---|---|'
            for d in artifact-per-abi/*/; do
              abi="$(basename "$d")"
              apk_name="$(ls "$d" | grep -E '\.apk$' | head -n1)"
              hash="$(awk '{print $1}' "$d/SHA256SUMS.txt")"
              echo "| $abi | $apk_name | \`${hash:0:16}…\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la artifact-per-abi/*/

      # Пять отдельных артефактов — по одному на архитектуру. Отдельные шаги
      # (а не matrix) потому, что matrix пересобирал бы весь job пять раз,
      # а actions/upload-artifact не умеет цикл внутри одного шага.
      # if-no-files-found: warn — чтобы сборка с ABI_FILTERS (частичный набор
      # архитектур) не падала на отсутствующем ABI.
      - name: Upload APK artifact (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: v2rayNG-${{ steps.collect.outputs.version }}-arm64-v8a
          path: artifact-per-abi/arm64-v8a/*
          if-no-files-found: warn

      - name: Upload APK artifact (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          name: v2rayNG-${{ steps.collect.outputs.version }}-armeabi-v7a
          path: artifact-per-abi/armeabi-v7a/*
          if-no-files-found: warn

      - name: Upload APK artifact (x86)
        uses: actions/upload-artifact@v7
        with:
          name: v2rayNG-${{ steps.collect.outputs.version }}-x86
          path: artifact-per-abi/x86/*
          if-no-files-found: warn

      - name: Upload APK artifact (x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: v2rayNG-${{ steps.collect.outputs.version }}-x86_64
          path: artifact-per-abi/x86_64/*
          if-no-files-found: warn

      - name: Upload APK artifact (universal)
        uses: actions/upload-artifact@v7
        with:
          name: v2rayNG-${{ steps.collect.outputs.version }}-universal
          path: artifact-per-abi/universal/*
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && steps.prepare.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_WRITE_TOKEN: ${{ secrets.REPO_WRITE_TOKEN }}
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
          IS_PRERELEASE: ${{ steps.prepare.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# v2rayNG ${RELEASE_VERSION} — сборка форка"
            echo
            if [ "$IS_PRERELEASE" = "true" ]; then
              echo "> **Предварительный выпуск (бета).** Ставьте только если включён"
              echo "> переключатель «Проверять предварительные версии» в разделе «Проверка обновлений»."
              echo
            fi
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Канал: $([ "$IS_PRERELEASE" = "true" ] && echo 'предварительная бета' || echo 'стабильная')"
            echo "- Подпись: $([ "${{ steps.signing.outputs.release }}" = "true" ] && echo "релизный ключ владельца" || echo "отладочная")"
            if [ "${{ steps.signing.outputs.release }}" = "true" ]; then
              echo "- Схемы подписи: **V1 + V2 + V3 + V4** (проверено apksigner в CI)"
              echo
              echo "> **Про подпись V4:** схема V4 хранится в парном файле \`.idsig\`,"
              echo "> а не внутри APK. Скачайте оба файла — \`*.apk\` и \`*.apk.idsig\` —"
              echo "> и положите их в одну папку. Тогда apktool и apksigner покажут"
              echo "> все четыре схемы: V1 + V2 + V3 + V4."
            fi
            echo
            echo "## Контрольные суммы (SHA-256)"
            echo '```'
            cat release-assets/SHA256SUMS.txt
            echo '```'
          } > release-notes.md

          # ---- Changelog for THIS release only ----
          # A token is required to list releases; REPO_WRITE_TOKEN has wider scope.
          export GH_TOKEN="${REPO_WRITE_TOKEN:-${GITHUB_TOKEN:-}}"
          git fetch --tags --force origin >/dev/null 2>&1 || true

          # Previous release by PUBLICATION TIME, never by tag-name sort: sorting
          # names as text picks the wrong neighbour and every changelog then
          # repeats the same commit range.
          PREV_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,publishedAt \
            --jq '[.[] | select(.tagName != env.RELEASE_TAG)] | sort_by(.publishedAt) | last | .tagName // ""' \
            2>/dev/null || true)"
          if [ -n "$PREV_TAG" ] && ! git rev-parse -q --verify \
              "refs/tags/${PREV_TAG}^{commit}" >/dev/null 2>&1; then
            PREV_TAG=""
          fi
          echo "Предыдущий релиз: ${PREV_TAG:-отсутствует}"

          {
            echo
            echo "## Что изменилось в этом выпуске"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "Коммиты с предыдущего опубликованного выпуска \`${PREV_TAG}\`:"
              echo
              RANGE_LOG="$(git log --no-merges --date=short \
                --pretty=format:'- %s (%h, %ad)' "${PREV_TAG}..HEAD" 2>/dev/null || true)"
            else
              echo "Предыдущий выпуск не найден. Последние 20 коммитов:"
              echo
              RANGE_LOG="$(git log --no-merges -n 20 --date=short \
                --pretty=format:'- %s (%h, %ad)' HEAD 2>/dev/null || true)"
            fi
            if [ -n "$RANGE_LOG" ]; then printf '%s\n' "$RANGE_LOG"; else echo "- Новых коммитов нет."; fi
          } >> release-notes.md

          GH_FLAGS=(--repo "$GITHUB_REPOSITORY"
                    --title "v2rayNG ${RELEASE_VERSION} — сборка форка"
                    --notes-file release-notes.md
                    --target "$GITHUB_SHA")
          if [ "$IS_PRERELEASE" = "true" ]; then
            # Upstream convention: the in-development build is published as a
            # GitHub prerelease, so `/releases/latest` keeps pointing at the last
            # stable build and the app's pre-release switch has something to find.
            GH_FLAGS+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release-assets/* "${GH_FLAGS[@]}" 2>&1 | tee /tmp/release.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || exit "$rc"

          # Mark Latest explicitly, but ONLY for a stable release. Setting
          # make_latest on a prerelease would move GitHub's "Latest" pointer onto
          # a beta, which is exactly the ordering bug we just fixed: /releases is
          # sorted by created_at while /releases/latest honours the flag.
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')"
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "Prerelease published; leaving the Latest pointer on the stable release."
          elif [ -n "${release_id:-}" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/${release_id}" \
              -f make_latest=true > /dev/null || true
            echo "Marked $RELEASE_TAG as Latest."
          fi

      - name: Commit the release version to master
        # The version bump lives only in the runner's working tree, so without
        # this step the next run would read the OLD versionName and collide on the
        # tag. Committing keeps master in sync with the published APK.
        #
        # For a STABLE release with no explicit bump, master then advances to the
        # next patch version, opening the next development cycle (upstream release
        # train): the just-published stable stays the "Latest" release, while new
        # betas built from master carry the higher version and are offered to users
        # who enabled pre-releases.
        #
        # Both commits are authored as github-actions[bot]; the `build` job guard
        # skips bot-authored pushes, so this does not start a second build loop.
        if: success() && steps.prepare.outputs.release_tag != '' && steps.prepare.outputs.version != ''
        env:
          REPO_WRITE_TOKEN: ${{ secrets.REPO_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          GRADLE="V2rayNG/app/build.gradle.kts"
          NEW_VER="${{ steps.prepare.outputs.version }}"
          NEW_CODE="${{ steps.prepare.outputs.version_code }}"
          TAG="${{ steps.prepare.outputs.release_tag }}"
          BUMP_AFTER="${{ steps.prepare.outputs.bump_after_release }}"
          NEXT_VER="${{ steps.prepare.outputs.next_version }}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$GRADLE"
          if ! git diff --cached --quiet; then
            git commit -m "chore(version): установить версию ${NEW_VER} (${NEW_CODE}) для ${TAG}"
          else
            echo "Release version already committed."
          fi

          if [ "$BUMP_AFTER" = "true" ] && [ -n "$NEXT_VER" ]; then
            NEXT_CODE=$((NEW_CODE + 1))
            sed -i -E "s/^([[:space:]]*versionCode[[:space:]]*=[[:space:]]*)[0-9]+/\1${NEXT_CODE}/" "$GRADLE"
            sed -i -E "s/^([[:space:]]*versionName[[:space:]]*=[[:space:]]*)\"[^\"]*\"/\1\"${NEXT_VER}\"/" "$GRADLE"
            git add "$GRADLE"
            git commit -m "chore(version): начать новый цикл разработки ${NEXT_VER} (${NEXT_CODE})"
          fi

          if [ -n "${REPO_WRITE_TOKEN:-}" ]; then
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$REPO_WRITE_TOKEN" | base64 -w0)" \
              push origin "HEAD:refs/heads/master"
          else
            git push origin "HEAD:refs/heads/master"
          fi
          echo "Published version state to master."
