name: Merge upstream and build v2rayNG

on:
  push:
    branches:
      - ci-master-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout fork workflow branch
        uses: actions/checkout@v7
        with:
          repository: FredoWanchampix/v2rayNG
          ref: ci-master-build
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.REPO_WRITE_TOKEN }}
          persist-credentials: true

      - name: Merge upstream into fork
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/2dust/v2rayNG.git
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          git fetch --no-tags upstream +refs/heads/master:refs/remotes/upstream/master

          FORK_MASTER_SHA="$(git rev-parse refs/remotes/origin/master)"
          UPSTREAM_SHA="$(git rev-parse refs/remotes/upstream/master)"

          echo "FORK_MASTER_SHA=$FORK_MASTER_SHA" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> "$GITHUB_ENV"

          git checkout -B integration "$FORK_MASTER_SHA"

          {
            echo "Fork master: $FORK_MASTER_SHA"
            echo "Upstream master: $UPSTREAM_SHA"
          } > merge-report.txt

          printf '%s\n' "No merge conflicts detected." > merge-conflicts.txt

          MERGE_POLICY="normal-merge"

          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            MERGE_POLICY="already-included"
            echo "Upstream is already included."
          else
            set +e
            git merge --no-commit --no-ff "$UPSTREAM_SHA"
            MERGE_STATUS=$?
            set -e

            CONFLICTS="$(git diff --name-only --diff-filter=U || true)"

            if [ -n "$CONFLICTS" ]; then
              printf '%s\n' "$CONFLICTS" > merge-conflicts.txt

              {
                echo
                echo "Files with overlapping changes:"
                printf '%s\n' "$CONFLICTS"
                echo
                echo "The workflow preserves fork-side conflict hunks."
              } >> merge-report.txt

              git merge --abort
              git merge --no-ff -X ours --no-edit "$UPSTREAM_SHA"

              MERGE_POLICY="fork-priority-with-compatible-source-files"

              COMPAT_FILES=(
                "V2rayNG/app/src/main/java/com/v2ray/ang/dto/entities/SubscriptionItem.kt"
                "V2rayNG/app/src/main/java/com/v2ray/ang/dto/RealPingEvent.kt"
                "V2rayNG/app/src/main/java/com/v2ray/ang/service/CoreTestService.kt"
                "V2rayNG/app/src/main/java/com/v2ray/ang/service/RealPingWorkerService.kt"
                "V2rayNG/app/src/main/java/com/v2ray/ang/extension/ToastExt.kt"
                "V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainActivity.kt"
                "V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainBottomBar.kt"
                "V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainContract.kt"
                "V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainDataSource.kt"
                "V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainDialogs.kt"
                "V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainDrawer.kt"
                "V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainGroupTab.kt"
                "V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainImportMenu.kt"
                "V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainRepository.kt"
                "V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainScreen.kt"
                "V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainServerPager.kt"
                "V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainServerRowModels.kt"
                "V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainServiceEvent.kt"
                "V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainTopBar.kt"
                "V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainViewModel.kt"
                "V2rayNG/app/src/main/java/com/v2ray/ang/ui/subscription/SubEditActivity.kt"
              )

              for path in "${COMPAT_FILES[@]}"; do
                if git cat-file -e "$FORK_MASTER_SHA:$path" 2>/dev/null; then
                  git checkout "$FORK_MASTER_SHA" -- "$path"
                fi
              done

              if ! git diff --cached --quiet; then
                git commit -m "Restore compatible fork implementations"
              fi

            elif [ "$MERGE_STATUS" -eq 0 ]; then
              git commit --allow-empty -m "Merge upstream 2dust/v2rayNG master"
            else
              echo "::error::Merge failed."
              exit 1
            fi
          fi

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "::error::Unresolved merge conflicts remain."
            exit 1
          fi

          git diff --check
          git submodule update --init --recursive

          echo "MERGE_POLICY=$MERGE_POLICY" >> "$GITHUB_ENV"
          echo "Merged commit: $(git rev-parse HEAD)" >> merge-report.txt
          cat merge-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: "14742923"
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 \
            --install "ndk;30.0.16248370"

          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Configure application and repair compatibility
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          def read_fork_file(path):
              return subprocess.check_output(
                  ["git", "show", f"{os.environ['FORK_MASTER_SHA']}:{path}"],
                  text=True,
              )

          gradle = Path("V2rayNG/app/build.gradle.kts")
          content = gradle.read_text(encoding="utf-8")

          upstream_gradle = subprocess.check_output(
              ["git", "show", f"{os.environ['UPSTREAM_SHA']}:V2rayNG/app/build.gradle.kts"],
              text=True,
          )

          def upstream_value(name):
              pattern = (
                  rf'(?m)^[ \t]*{re.escape(name)}[ \t]*=[ \t]*'
                  rf'(?:"([^"]*)"|(\d+))[ \t]*$'
              )
              match = re.search(pattern, upstream_gradle)
              if not match:
                  raise SystemExit(f"Cannot read upstream {name}")
              return match.group(1) if match.group(1) is not None else match.group(2)

          version_code = upstream_value("versionCode")
          version_name = upstream_value("versionName")

          content, count_code = re.subn(
              r"(?m)^([ \t]*versionCode[ \t]*=[ \t]*)\d+([ \t]*)$",
              lambda m: f"{m.group(1)}{version_code}{m.group(2)}",
              content,
              count=1,
          )

          content, count_name = re.subn(
              r'(?m)^([ \t]*versionName[ \t]*=[ \t]*)"[^"]*"([ \t]*)$',
              lambda m: f'{m.group(1)}"{version_name}"{m.group(2)}',
              content,
              count=1,
          )

          if count_code != 1 or count_name != 1:
              raise SystemExit("Cannot safely update application version")

          ndk_pattern = r'(?m)^([ \t]*ndkVersion[ \t]*=[ \t]*)"[^"]*"'
          if re.search(ndk_pattern, content):
              content, count_ndk = re.subn(
                  ndk_pattern,
                  r'\g<1>"30.0.16248370"',
                  content,
                  count=1,
              )
          else:
              content, count_ndk = re.subn(
                  r"(?m)^android[ \t]*\{[ \t]*$",
                  'android {\n    ndkVersion = "30.0.16248370"',
                  content,
                  count=1,
              )

          if count_ndk != 1:
              raise SystemExit("Cannot safely configure NDK version")

          content, removed_libbox = re.subn(
              r'(?m)^[ \t]*implementation\(files\("libs/libbox(?:-legacy)?\.aar"\)\)[ \t]*\r?\n',
              "",
              content,
          )
          gradle.write_text(content, encoding="utf-8")

          subscription = Path(
              "V2rayNG/app/src/main/java/com/v2ray/ang/dto/entities/SubscriptionItem.kt"
          )
          sub_text = subscription.read_text(encoding="utf-8")
          usage_field = "var usageInfo: SubscriptionUsageInfo? = null,"

          if usage_field not in sub_text:
              marker = "    var requestHeaders: String? = null,"
              if sub_text.count(marker) != 1:
                  raise SystemExit("Cannot safely extend SubscriptionItem")
              subscription.write_text(
                  sub_text.replace(marker, marker + "\n    " + usage_field, 1),
                  encoding="utf-8",
              )

          converter = Path(
              "V2rayNG/app/src/main/java/com/v2ray/ang/core/SingBoxConfigConverter.kt"
          )
          if converter.exists():
              converter_text = converter.read_text(encoding="utf-8")
              wrong = 'addProperty("tls", JsonObject().apply {'
              correct = 'add("tls", JsonObject().apply {'

              if wrong in converter_text:
                  converter_text, count_tls = re.subn(
                      re.escape(wrong), correct, converter_text, count=1
                  )
                  if count_tls != 1:
                      raise SystemExit("Cannot safely fix the TLS JSON object")
                  converter.write_text(converter_text, encoding="utf-8")

          main_view_model = Path(
              "V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainViewModel.kt"
          )
          main_text = main_view_model.read_text(encoding="utf-8")
          main_text, count_reference = re.subn(
              r"R\.string\.title_update_config_count\b",
              "R.string.title_update_config_count_legacy",
              main_text,
          )

          if count_reference != 1:
              raise SystemExit(
                  "Expected one title_update_config_count reference in "
                  f"MainViewModel.kt; found {count_reference}"
              )

          main_view_model.write_text(main_text, encoding="utf-8")

          def original_string_value(resource_path):
              original = read_fork_file(resource_path)
              match = re.search(
                  r'<string\s+name="title_update_config_count"[^>]*>(.*?)</string>',
                  original,
                  re.S,
              )
              if not match:
                  raise SystemExit(
                      f"Cannot recover original update-count string from {resource_path}"
                  )
              return match.group(1)

          for resource_path in (
              "V2rayNG/app/src/main/res/values/strings.xml",
              "V2rayNG/app/src/main/res/values-ru/strings.xml",
          ):
              resource = Path(resource_path)
              resource_text = resource.read_text(encoding="utf-8")

              if 'name="title_update_config_count_legacy"' not in resource_text:
                  value = original_string_value(resource_path)
                  legacy = (
                      '    <string name="title_update_config_count_legacy">'
                      + value
                      + '</string>\n'
                  )
                  if resource_text.count("</resources>") != 1:
                      raise SystemExit(f"Cannot safely update {resource_path}")
                  resource_text = resource_text.replace(
                      "</resources>", legacy + "</resources>", 1
                  )
                  resource.write_text(resource_text, encoding="utf-8")

          libbox_references = []
          for source in Path("V2rayNG/app/src").rglob("*"):
              if source.suffix not in {".kt", ".java"}:
                  continue
              for number, line in enumerate(
                  source.read_text(encoding="utf-8", errors="replace").splitlines(),
                  1,
              ):
                  if "io.nekohasekai.libbox" in line:
                      libbox_references.append(f"{source}:{number}: {line.strip()}")

          if libbox_references:
              raise SystemExit(
                  "Cannot remove libbox AARs while direct source references remain:\n"
                  + "\n".join(libbox_references)
              )

          print(f"Upstream version: {version_name} ({version_code})")
          print(f"Removed explicit libbox dependencies: {removed_libbox}")
          print("Added fork-compatible update-count resources.")
          PY

          rm -f V2rayNG/app/libs/libbox.aar
          rm -f V2rayNG/app/libs/libbox-legacy.aar

          git diff --check

          git add \
            V2rayNG/app/build.gradle.kts \
            V2rayNG/app/src/main/java/com/v2ray/ang/dto/entities/SubscriptionItem.kt \
            V2rayNG/app/src/main/java/com/v2ray/ang/core/SingBoxConfigConverter.kt \
            V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainViewModel.kt \
            V2rayNG/app/src/main/res/values/strings.xml \
            V2rayNG/app/src/main/res/values-ru/strings.xml

          if ! git diff --cached --quiet; then
            git commit -m "Fix Kotlin resource compatibility in merged build"
          fi

          echo "MERGED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build hevtun native libraries
        shell: bash
        run: |
          set -euo pipefail
          bash compile-hevtun.sh

      - name: Stage native libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p V2rayNG/app/libs
          cp -r libs/. V2rayNG/app/libs/
          rm -f V2rayNG/app/libs/libbox.aar
          rm -f V2rayNG/app/libs/libbox-legacy.aar

      - name: Find AndroidLibXrayLite release tag
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_TAG="$(git -C AndroidLibXrayLite describe --tags --abbrev=0)"

          if [ -z "$CURRENT_TAG" ]; then
            echo "::error::AndroidLibXrayLite release tag was not found."
            exit 1
          fi

          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"
          echo "Using AndroidLibXrayLite tag: $CURRENT_TAG"

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.CURRENT_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Play Store debug APK
        working-directory: V2rayNG
        shell: bash
        run: |
          set -euo pipefail

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew

          ./gradlew \
            :app:assemblePlaystoreDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK and create report
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="V2rayNG/app/build/outputs/apk/playstore/debug"

          {
            echo "# v2rayNG merge build"
            echo
            echo "- Fork master: ${FORK_MASTER_SHA:-unknown}"
            echo "- Official upstream: ${UPSTREAM_SHA:-unknown}"
            echo "- Merged commit: ${MERGED_SHA:-unknown}"
            echo "- Merge policy: ${MERGE_POLICY:-unknown}"
            echo
            echo "## APK files"
          } > build-report.txt

          if [ -d "$APK_DIR" ]; then
            mapfile -t APKS < <(
              find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | sort
            )
            if [ "${#APKS[@]}" -gt 0 ]; then
              for APK in "${APKS[@]}"; do
                sha256sum "$APK" >> build-report.txt
              done
            else
              echo "No APK was produced." >> build-report.txt
            fi
          else
            echo "APK directory does not exist." >> build-report.txt
          fi

          cat build-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2rayNG-merged-build
          path: |
            V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
            build-report.txt
            merge-report.txt
            merge-conflicts.txt
          if-no-files-found: warn

      - name: Publish merged source to fork master
        if: success()
        shell: bash
        env:
          REPO_WRITE_TOKEN: ${{ secrets.REPO_WRITE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${REPO_WRITE_TOKEN:-}" ]; then
            echo "::error::REPO_WRITE_TOKEN is missing."
            exit 1
          fi

          git diff --check
          git push origin HEAD:refs/heads/master

          {
            echo
            echo "## Publication"
            echo
            echo "Published commit: $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
