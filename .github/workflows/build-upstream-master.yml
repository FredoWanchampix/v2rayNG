name: Sync upstream and build v2rayNG

# Автоматическая синхронизация с 2dust/v2rayNG и сборка релизных APK.
#
# Ключевые отличия от прежней версии:
#   1. Конфликты НЕ гасятся через `-X ours`. Любой конфликт => job падает,
#      master не трогается, создаётся/обновляется issue со списком файлов.
#      Так изменения upstream никогда не теряются молча.
#   2. Не удаляются libbox*.aar: в этом форке их нет ни в build.gradle.kts,
#      ни в исходниках (проверено), шаг был мёртвым кодом.
#   3. Собираются релизные варианты (все ABI), а не только PlaystoreDebug.
#   4. Перед публикацией в master создаётся резервная ветка прежнего master.
#   5. Добавлен шаг эквивалентности: все файлы, которые тронул только upstream,
#      обязаны остаться байт-в-байт как в upstream, иначе сборка падает.
#   6. Есть schedule (раз в сутки) - форк больше не отстаёт молча.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag"
        required: false
        type: string
      publish:
        description: "Push merged result to master"
        required: false
        type: boolean
        default: true
  push:
    branches:
      - ci-master-build

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  NDK_VERSION: "30.0.16248370"
  UPSTREAM_REPO: 2dust/v2rayNG

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
          token: ${{ secrets.REPO_WRITE_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Merge upstream (strict, no silent conflict resolution)
        id: merge
        shell: bash
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream +refs/heads/master:refs/remotes/upstream/master

          FORK_SHA="$(git rev-parse HEAD)"
          UPSTREAM_SHA="$(git rev-parse refs/remotes/upstream/master)"
          MERGE_BASE="$(git merge-base "$FORK_SHA" "$UPSTREAM_SHA")"

          {
            echo "FORK_SHA=$FORK_SHA"
            echo "UPSTREAM_SHA=$UPSTREAM_SHA"
            echo "MERGE_BASE=$MERGE_BASE"
          } >> "$GITHUB_ENV"

          {
            echo "# Upstream sync report"
            echo
            echo "- Fork master: \`$FORK_SHA\`"
            echo "- Upstream master: \`$UPSTREAM_SHA\`"
            echo "- Merge base: \`$MERGE_BASE\`"
          } > merge-report.md

          if [ "$UPSTREAM_SHA" = "$MERGE_BASE" ]; then
            echo "policy=already-up-to-date" >> "$GITHUB_OUTPUT"
            echo "MERGE_POLICY=already-up-to-date" >> "$GITHUB_ENV"
            echo "MERGED_SHA=$FORK_SHA" >> "$GITHUB_ENV"
            echo "- Result: already up to date, nothing to merge." >> merge-report.md
            echo "- Application version: **$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' V2rayNG/app/build.gradle.kts | head -n1)**" >> merge-report.md
            cat merge-report.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BEHIND="$(git rev-list --count "$MERGE_BASE..$UPSTREAM_SHA")"
          AHEAD="$(git rev-list --count "$MERGE_BASE..$FORK_SHA")"
          echo "- Upstream commits to integrate: **$BEHIND**" >> merge-report.md
          echo "- Fork-only commits: **$AHEAD**" >> merge-report.md
          echo >> merge-report.md
          echo "## Upstream commits" >> merge-report.md
          echo '```' >> merge-report.md
          git log --no-merges --pretty=format:'%h %s' "$MERGE_BASE..$UPSTREAM_SHA" >> merge-report.md
          echo '```' >> merge-report.md

          set +e
          git merge --no-ff --no-edit "$UPSTREAM_SHA" > merge-out.txt 2>&1
          MERGE_STATUS=$?
          set -e
          cat merge-out.txt

          if [ "$MERGE_STATUS" -ne 0 ]; then
            CONFLICTS="$(git diff --name-only --diff-filter=U || true)"
            printf '%s\n' "$CONFLICTS" > conflicts.txt

            # ---- Owner-preapproved resolution (SHA-keyed overlay) ----
            # A fully reviewed merged tree for every conflicting path is stored in
            # .github/merge-fixes/<upstream-sha>/ on master. It is applied ONLY when the
            # incoming upstream SHA matches exactly, so a future upstream bump can never
            # be silently overwritten: on a new SHA the merge stops and opens an issue.
            FIXDIR=".github/merge-fixes/${UPSTREAM_SHA}"
            if [ -d "$FIXDIR" ]; then
              cp -a "$FIXDIR/." .
              echo "Applied reviewed merge-fixes overlay for ${UPSTREAM_SHA}."
            else
              echo "::warning::No merge-fixes overlay for upstream ${UPSTREAM_SHA}; cannot auto-resolve."
            fi
            # build.yml is not in the overlay: keep the fork CI (sidecar engines).
            git checkout --ours -- .github/workflows/build.yml 2>/dev/null || true

            # Stage everything EXCEPT submodule paths. A blanket `git add -A`
            # during a conflicted merge re-stages each submodule at the commit
            # currently checked out in the working tree (still the pre-merge one),
            # which silently reverts an upstream submodule bump - that dropped the
            # AndroidLibXrayLite pointer and the equivalence check caught it. The
            # index already holds the correct auto-merged submodule pointer, so we
            # must leave those paths untouched.
            EXCL=()
            while read -r sp; do
              [ -n "$sp" ] && EXCL+=(":(exclude)$sp")
            done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' 2>/dev/null | awk '{print $2}')
            if [ "${#EXCL[@]}" -gt 0 ]; then
              echo "Submodule paths excluded from staging: ${EXCL[*]}"
              git add -A -- . "${EXCL[@]}"
            else
              git add -A
            fi

            RESOLVED=1
            if [ -n "$(git diff --name-only --diff-filter=U || true)" ]; then RESOLVED=0; fi
            # Belt and braces: no conflict markers may survive in the tree.
            if git grep -Il -e '^<<<<<<< ' -e '^>>>>>>> ' -- '*.kt' '*.xml' '*.yml' >/dev/null 2>&1; then
              RESOLVED=0
            fi

            if [ "$RESOLVED" = 1 ] && [ -z "$(git diff --name-only --diff-filter=U)" ]; then
              # Re-stage everything EXCEPT submodules (see the note above): a bare
              # `git add -A` here would rewrite the auto-merged submodule gitlink
              # back to the pre-merge working-tree commit.
              if [ "${#EXCL[@]}" -gt 0 ]; then
                git add -A -- . "${EXCL[@]}"
              else
                git add -A
              fi
              git commit --no-edit
              RESOLVED_POLICY=1
              echo "policy=resolved-by-rules" >> "$GITHUB_OUTPUT"
              echo "MERGE_POLICY=resolved-by-rules" >> "$GITHUB_ENV"
              {
                echo
                echo "## Conflicts resolved by owner-approved rules"
                echo '```'
                printf '%s\n' "$CONFLICTS"
                echo '```'
              } >> merge-report.md
              cat merge-report.md >> "$GITHUB_STEP_SUMMARY"
            else
              git merge --abort || true
              echo >> merge-report.md
              echo "## CONFLICTS - merge stopped, master NOT updated" >> merge-report.md
              echo '```' >> merge-report.md
              printf '%s\n' "$CONFLICTS" >> merge-report.md
              echo '```' >> merge-report.md
              echo "policy=conflict" >> "$GITHUB_OUTPUT"
              echo "MERGE_POLICY=conflict" >> "$GITHUB_ENV"
              cat merge-report.md >> "$GITHUB_STEP_SUMMARY"
              echo "conflict_list<<EOF" >> "$GITHUB_OUTPUT"
              printf '%s\n' "$CONFLICTS" >> "$GITHUB_OUTPUT"
              echo "EOF" >> "$GITHUB_OUTPUT"
              echo "::error::Merge conflicts require manual resolution. See the job summary."
              exit 1
            fi
          fi

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "::error::Unresolved conflicts remain after merge."
            exit 1
          fi

          if [ "${RESOLVED_POLICY:-0}" != "1" ]; then
            echo "policy=merged" >> "$GITHUB_OUTPUT"
            echo "MERGE_POLICY=clean-merge" >> "$GITHUB_ENV"
          fi
          echo >> merge-report.md
          echo "- Result: **clean merge**, no conflicts." >> merge-report.md

          # Форк держит свою версию приложения с суффиксом, но номер берём из upstream,
          # чтобы versionCode всегда рос и обновления устанавливались поверх.
          UP_VERSION_NAME="$(git show "$UPSTREAM_SHA:V2rayNG/app/build.gradle.kts" \
            | sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)"
          UP_VERSION_CODE="$(git show "$UPSTREAM_SHA:V2rayNG/app/build.gradle.kts" \
            | sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9]*\).*/\1/p' | head -n1)"

          if [ -z "$UP_VERSION_NAME" ] || [ -z "$UP_VERSION_CODE" ]; then
            echo "::error::Cannot read upstream version from build.gradle.kts."
            exit 1
          fi

          sed -i -E "s/^([[:space:]]*versionCode[[:space:]]*=[[:space:]]*)[0-9]+/\1${UP_VERSION_CODE}/" \
            V2rayNG/app/build.gradle.kts
          sed -i -E "s/^([[:space:]]*versionName[[:space:]]*=[[:space:]]*)\"[^\"]*\"/\1\"${UP_VERSION_NAME}\"/" \
            V2rayNG/app/build.gradle.kts

          grep -nE "versionCode|versionName|ndkVersion" V2rayNG/app/build.gradle.kts | head

          if ! grep -qE '^[[:space:]]*ndkVersion[[:space:]]*=' V2rayNG/app/build.gradle.kts; then
            sed -i -E "0,/^android[[:space:]]*\{/s//android \{\n    ndkVersion = \"${NDK_VERSION}\"/" \
              V2rayNG/app/build.gradle.kts
          else
            sed -i -E "s/^([[:space:]]*ndkVersion[[:space:]]*=[[:space:]]*)\"[^\"]*\"/\1\"${NDK_VERSION}\"/" \
              V2rayNG/app/build.gradle.kts
          fi

          echo "VERSION_NAME=$UP_VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$UP_VERSION_CODE" >> "$GITHUB_ENV"
          echo "- Application version set to: **$UP_VERSION_NAME** ($UP_VERSION_CODE)" >> merge-report.md

          git submodule update --init --recursive
          git diff --check
          git add V2rayNG/app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m "chore: pin ndkVersion and sync version with upstream ${UP_VERSION_NAME}"
          fi

          echo "MERGED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cat merge-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open issue on conflict
        # Never fail the job because of the notification itself: the merge step has
        # already marked the run red. Reporting must not mask the real error, and
        # issues may be disabled on the repo (then this is a warning, not a failure).
        if: failure() && steps.merge.outputs.policy == 'conflict'
        continue-on-error: true
        env:
          # The default GITHUB_TOKEN of a fork run cannot create issues
          # ("Resource not accessible by integration"), so prefer the owner PAT.
          GH_TOKEN: ${{ secrets.REPO_WRITE_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          TITLE="Upstream merge conflict $(date -u +%Y-%m-%d)"
          BODY="$(cat merge-report.md)"
          echo "Reporting the conflict list to the job summary (always available)."
          {
            echo
            echo "### Conflict report could not be filed as an issue"
            echo '```'
            printf '%s\n' "$BODY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          EXISTING="$(gh issue list --state open --search "in:title $TITLE" --json number -q '.[0].number' 2>/dev/null || true)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY" \
              && echo "Commented on issue #$EXISTING." \
              || echo "::warning::Could not comment on issue #$EXISTING."
          elif gh issue create --title "$TITLE" --body "$BODY" 2>/tmp/issue.err; then
            echo "Created a conflict issue."
          else
            echo "::warning::Could not create an issue (issues may be disabled or the token lacks scope): $(cat /tmp/issue.err | tail -1)"
          fi
          exit 0

      - name: Verify upstream changes were not dropped
        shell: bash
        run: |
          set -euo pipefail
          if [ "${MERGE_POLICY}" = "already-up-to-date" ]; then
            echo "Nothing was merged, skipping equivalence check."
            exit 0
          fi

          git diff --name-only "$MERGE_BASE" "$UPSTREAM_SHA" | sort > /tmp/up.txt
          git diff --name-only "$MERGE_BASE" "$FORK_SHA"     | sort > /tmp/fork.txt
          comm -23 /tmp/up.txt /tmp/fork.txt > /tmp/upstream-only.txt

          echo "Files changed by upstream only: $(wc -l < /tmp/upstream-only.txt)"
          lost=0
          while read -r f; do
            [ -n "$f" ] || continue
            if ! git diff --quiet "$UPSTREAM_SHA" HEAD -- "$f"; then
              echo "::error::Upstream change was lost in the merged tree: $f"
              lost=1
            fi
          done < /tmp/upstream-only.txt
          [ "$lost" -eq 0 ] || exit 1

          {
            echo
            echo "## Equivalence check"
            echo
            echo "All $(wc -l < /tmp/upstream-only.txt) upstream-only files are byte-identical"
            echo "to upstream after the merge."
          } >> merge-report.md
          echo "Upstream-only files verified: OK" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: "14742923"
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Restore cached libhevtun
        id: cache-hevtun
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build hevtun native libraries
        if: steps.cache-hevtun.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash compile-hevtun.sh

      - name: Save libhevtun
        if: steps.cache-hevtun.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Stage native libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p V2rayNG/app/libs
          cp -r libs/. V2rayNG/app/libs/

      - name: Find AndroidLibXrayLite release tag
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_TAG="$(git -C AndroidLibXrayLite describe --tags --abbrev=0 || true)"
          if [ -z "$CURRENT_TAG" ]; then
            CURRENT_TAG="$(curl -fsSL --retry 3 \
              "https://api.github.com/repos/${UPSTREAM_REPO%/*}/AndroidLibXrayLite/releases/latest" \
              | jq -r '.tag_name')"
          fi
          if [ -z "$CURRENT_TAG" ] || [ "$CURRENT_TAG" = "null" ]; then
            echo "::error::AndroidLibXrayLite tag not found."; exit 1
          fi
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"
          echo "Using AndroidLibXrayLite tag: $CURRENT_TAG"

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.CURRENT_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Verify native libraries
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          [ -f V2rayNG/app/libs/libv2ray.aar ] || { echo "::error::libv2ray.aar missing"; fail=1; }
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            for lib in libhev-socks5-tunnel.so libhevsockstun.so; do
              [ -f "V2rayNG/app/libs/$abi/$lib" ] || { echo "::error::libs/$abi/$lib missing"; fail=1; }
            done
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "Native libraries OK"

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Go for sidecar engines
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false

      - name: Fetch and build sidecar engine binaries
        shell: bash
        env:
          MIHOMO_TAG: v1.19.33
          MIHOMO_SHA256: cfa0be78846bfef7272fe5a73089f8cf0e1f15a6ffb601f5cc809f457f712f67
          SINGBOX_TAG: v1.14.4
        run: |
          set -euo pipefail
          mkdir -p V2rayNG/app/src/main/assets/engines

          # mihomo: official prebuilt android-arm64 binary (AmneziaWG 3.x/1.x).
          curl -fsSL --retry 4 -o /tmp/mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_TAG}/mihomo-android-arm64-v8-${MIHOMO_TAG}.gz"
          gunzip -f /tmp/mihomo.gz
          # The pin covers the unpacked binary: gz wrappers differ per upload.
          echo "${MIHOMO_SHA256}  /tmp/mihomo" | sha256sum -c -
          install -m 0755 /tmp/mihomo V2rayNG/app/src/main/assets/engines/mihomo

          # sing-box: official releases ship no naive outbound, so build from
          # source with the documented tag; openconnect endpoint is in core.
          git clone --depth 1 --branch "${SINGBOX_TAG}" https://github.com/SagerNet/sing-box /tmp/sing-box
          cd /tmp/sing-box
          # The naive outbound imports cronet-go, whose android_arm64 package is
          # cgo-only: CGO_ENABLED=0 excludes all of its files. Cross-compile with
          # the NDK clang instead. gvisor is not needed (the sidecar runs without
          # a tun inbound), so keep the tag set minimal.
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 \
            CC="$NDK_BIN/aarch64-linux-android24-clang" \
            CXX="$NDK_BIN/aarch64-linux-android24-clang++" \
            go build -trimpath -buildvcs=false -tags with_naive_outbound \
            -ldflags="-s -w -X github.com/sagernet/sing-box/constant.Version=${SINGBOX_TAG}" \
            -o sing-box ./cmd/sing-box
          cd -
          install -m 0755 /tmp/sing-box/sing-box V2rayNG/app/src/main/assets/engines/sing-box

          # Mimic: Hysteria2-family transport (MTP + TLS mimicry) Go client,
          # cross-compiled here, never on the phone.
          git clone --depth 1 https://github.com/Locon213/Mimic-Protocol /tmp/mimic
          cd /tmp/mimic
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o mimic-client ./cmd/client
          cd -
          install -m 0755 /tmp/mimic/mimic-client V2rayNG/app/src/main/assets/engines/mimic-client

          ls -la V2rayNG/app/src/main/assets/engines/
          echo "## Sidecar engines" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sha256sum V2rayNG/app/src/main/assets/engines/* >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Build FPTN client (best effort)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # FPTN has no Android artifact upstream: the C++ client is cross
          # compiled here with the NDK. If any dependency proves unstable the
          # step is allowed to fail: the app then reports the engine as not
          # bundled instead of breaking the whole release.
          git clone --depth 1 https://github.com/fptn-project/fptn /tmp/fptn
          cd /tmp/fptn
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release -DFPTN_BUILD_CLIENT=ON -DFPTN_BUILD_SERVER=OFF
          cmake --build build -j"$(nproc)"
          BIN="$(find build -type f -perm -u+x \( -name 'fptn-client*' -o -name 'fptn_client*' \) | head -1)"
          if [ -z "$BIN" ]; then
            echo "::warning::fptn-client binary not found after build; skipping engine"
            exit 0
          fi
          install -m 0755 "$BIN" V2rayNG/app/src/main/assets/engines/fptn-client
          cd -
          echo "FPTN client bundled from $BIN"

      - name: Detect signing material
        id: signing
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${APP_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$APP_KEYSTORE_BASE64" | base64 -d > android_keystore.jks
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "keystore=$PWD/android_keystore.jks" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APP_KEYSTORE_BASE64 is not set - falling back to a debug-signed build."
          fi

      - name: Run unit tests (non-blocking)
        id: tests
        continue-on-error: true
        working-directory: V2rayNG
        shell: bash
        run: |
          set -uo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:testPlaystoreDebugUnitTest --no-daemon --stacktrace 2>&1 | tee /tmp/tests.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Unit tests failed (exit $rc) - packaging continues."
          fi
          exit 0

      - name: Build APKs
        id: buildapk
        working-directory: V2rayNG
        shell: bash
        env:
          IS_RELEASE: ${{ steps.signing.outputs.release }}
          KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew

          if [ "$IS_RELEASE" = "true" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace \
              "-Pandroid.injected.signing.store.file=$KEYSTORE_FILE" \
              "-Pandroid.injected.signing.store.password=$APP_KEYSTORE_PASSWORD" \
              "-Pandroid.injected.signing.key.alias=$APP_KEYSTORE_ALIAS" \
              "-Pandroid.injected.signing.key.password=$APP_KEY_PASSWORD" \
              2>&1 | tee /tmp/build.log
          else
            ./gradlew assemblePlaystoreDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          fi
          rc=${PIPESTATUS[0]}
          echo "Gradle exit code: $rc"
          exit "$rc"

      - name: Report Gradle failure as annotations
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          : > /tmp/err.txt
          for f in /tmp/build.log /tmp/tests.log /tmp/release.log; do
            [ -f "$f" ] || continue
            {
              echo "=== $f ==="
              grep -nE "^e: |^w: .*(rror|nresolved)|FAILURE: |What went wrong|Execution failed|Caused by:|error: |> Task .* FAILED|BUILD FAILED|Could not resolve|Could not find|A problem occurred|tests? completed|FAILED$" "$f" | tail -50
              echo "--- tail 60 ---"
              tail -60 "$f"
            } >> /tmp/err.txt 2>&1 || true
          done
          if [ ! -s /tmp/err.txt ]; then
            echo "no gradle log captured" >> /tmp/err.txt
          fi
          n=0
          while IFS= read -r line; do
            n=$((n+1))
            [ "$n" -gt 60 ] && break
            safe=$(printf '%s' "$line" | sed 's/%/%25/g' | tr -d '\r' | cut -c1-450)
            echo "::error title=log-$n::${safe}"
          done < /tmp/err.txt
          echo "Emitted $n annotation lines from the Gradle logs."

      - name: Collect APKs and release notes
        id: release
        env:
          REQUESTED_TAG: ${{ github.event.inputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_WRITE_TOKEN: ${{ secrets.REPO_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="${VERSION_NAME:-$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' V2rayNG/app/build.gradle.kts | head -n1)}"
          [ -n "$VERSION_NAME" ] || { echo "::error::Cannot determine version."; exit 1; }

          if [ "${{ steps.signing.outputs.release }}" = "true" ]; then SUB=release; else SUB=debug; fi

          mkdir -p release-assets
          mapfile -t APKS < <(find V2rayNG/app/build/outputs/apk -type f -name '*.apk' -path "*/$SUB/*" | sort)
          [ "${#APKS[@]}" -gt 0 ] || { echo "::error::No APK produced."; exit 1; }
          cp "${APKS[@]}" release-assets/
          ( cd release-assets && sha256sum ./*.apk > SHA256SUMS.txt )

          if [ -n "${REQUESTED_TAG:-}" ]; then RELEASE_TAG="$REQUESTED_TAG"
          else RELEASE_TAG="v${VERSION_NAME}-fork-$(date -u +%Y%m%d-%H%M%S)"; fi

          {
            echo "# v2rayNG ${VERSION_NAME} - fork build"
            echo
            echo "- Upstream: https://github.com/${UPSTREAM_REPO} @ \`${UPSTREAM_SHA}\`"
            echo "- Merge policy: \`${MERGE_POLICY}\`"
            echo "- Build type: $([ "$SUB" = release ] && echo 'release (signed)' || echo 'debug')"
            echo
            echo "## Checksums"
            echo '```'
            cat release-assets/SHA256SUMS.txt
            echo '```'
            echo
            echo "## Which APK"
            echo
            echo "- \`universal\` - works on any architecture"
            echo "- \`arm64-v8a\` - 64-bit ARM (most phones since 2017)"
            echo "- \`armeabi-v7a\` - 32-bit ARM"
            echo "- \`x86_64\` / \`x86\` - emulators"
          } > release-notes.md
          # ---- Changelog for THIS release only ----
          # A token is required to list releases; REPO_WRITE_TOKEN has wider scope.
          export GH_TOKEN="${REPO_WRITE_TOKEN:-${GITHUB_TOKEN:-}}"
          git fetch --tags --force origin >/dev/null 2>&1 || true

          # Most recent published release other than the one being created now.
          # It MUST be picked by publication time: sorting tag names as text picks
          # the wrong neighbour (v2.3.15-fork-2026... sorts after
          # v2.3.15-engines-ui2), which made every changelog repeat the same
          # commit range instead of listing only what is new in THIS release.
          export RELEASE_TAG
          PREV_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,publishedAt \
            --jq '[.[] | select(.tagName != env.RELEASE_TAG)] | sort_by(.publishedAt) | last | .tagName // ""' \
            2>/dev/null || true)"
          if [ -n "$PREV_TAG" ] && ! git rev-parse -q --verify \
              "refs/tags/${PREV_TAG}^{commit}" >/dev/null 2>&1; then
            PREV_TAG=""
          fi
          echo "Previous release tag: ${PREV_TAG:-<none>}"

          # Keep upstream commits out of the fork list; they get their own
          # section below, otherwise every merged commit would appear twice.
          NOT_ARGS=()
          if [ -n "${UPSTREAM_SHA:-}" ]; then NOT_ARGS=(--not "$UPSTREAM_SHA"); fi

          {
            echo
            echo "## What changed in this release"
            echo
            echo "### Fork commits"
            echo
            if [ -n "$PREV_TAG" ]; then
              RANGE_LOG="$(git log --no-merges --date=short \
                --pretty=format:'- %s (%h, %ad)' "${PREV_TAG}..HEAD" "${NOT_ARGS[@]}" 2>/dev/null || true)"
            else
              RANGE_LOG="$(git log --no-merges -n 20 --date=short \
                --pretty=format:'- %s (%h, %ad)' HEAD "${NOT_ARGS[@]}" 2>/dev/null || true)"
            fi
            if [ -n "$RANGE_LOG" ]; then printf '%s\n' "$RANGE_LOG"; else echo "- No new fork commits."; fi
            echo
            echo "### Upstream commits integrated"
            echo
            if [ "${MERGE_POLICY:-}" = "already-up-to-date" ]; then
              echo "- Already up to date with \`${UPSTREAM_REPO}\`; nothing new."
            elif [ -n "${MERGE_BASE:-}" ] && [ -n "${UPSTREAM_SHA:-}" ]; then
              UP_LOG="$(git log --no-merges --date=short \
                --pretty=format:'- %s (%h, %ad)' "${MERGE_BASE}..${UPSTREAM_SHA}" 2>/dev/null || true)"
              if [ -n "$UP_LOG" ]; then printf '%s\n' "$UP_LOG"; else echo "- None."; fi
            else
              echo "- Not a merge run."
            fi
          } >> release-notes.md

          echo "tag=$RELEASE_TAG"     >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2rayNG-${{ steps.release.outputs.version }}
          path: |
            release-assets/*
            merge-report.md
          if-no-files-found: warn

      - name: Backup previous master
        shell: bash
        run: |
          set -euo pipefail
          BACKUP="backup/master-$(date -u +%Y%m%d-%H%M%S)"
          git push origin "${FORK_SHA}:refs/heads/$BACKUP" || \
            echo "::warning::Could not create backup branch $BACKUP"
          echo "Backup of the previous master: \`$BACKUP\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish merged source to master
        if: success() && (github.event.inputs.publish != 'false')
        env:
          REPO_WRITE_TOKEN: ${{ secrets.REPO_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if [ -n "${REPO_WRITE_TOKEN:-}" ]; then
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$REPO_WRITE_TOKEN" | base64 -w0)" \
              push origin "HEAD:refs/heads/master"
          else
            git push origin "HEAD:refs/heads/master"
          fi
          echo "Published $(git rev-parse HEAD) to master" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.REPO_WRITE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "v2rayNG ${{ steps.release.outputs.version }} - fork build" \
            --notes-file release-notes.md \
            --target "$(git rev-parse HEAD)" \
            --latest 2>&1 | tee /tmp/release.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || exit "$rc"
