name: Merge upstream and build v2rayNG

on:
  push:
    branches:
      - ci-master-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout fork workflow branch
        uses: actions/checkout@v7
        with:
          repository: FredoWanchampix/v2rayNG
          ref: ci-master-build
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.REPO_WRITE_TOKEN }}
          persist-credentials: true

      - name: Merge official upstream into fork master
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/2dust/v2rayNG.git

          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          git fetch --no-tags upstream +refs/heads/master:refs/remotes/upstream/master

          FORK_MASTER_SHA="$(git rev-parse refs/remotes/origin/master)"
          UPSTREAM_SHA="$(git rev-parse refs/remotes/upstream/master)"

          echo "FORK_MASTER_SHA=$FORK_MASTER_SHA" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> "$GITHUB_ENV"

          git checkout -B integration "$FORK_MASTER_SHA"

          {
            echo "Fork master: $FORK_MASTER_SHA"
            echo "Upstream master: $UPSTREAM_SHA"
          } > merge-report.txt

          printf '%s\n' "No merge conflicts detected." > merge-conflicts.txt

          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "MERGE_POLICY=already-included" >> "$GITHUB_ENV"
            echo "Merge status: upstream already included" >> merge-report.txt
          else
            set +e
            git merge --no-commit --no-ff "$UPSTREAM_SHA"
            MERGE_STATUS=$?
            set -e

            CONFLICTS="$(git diff --name-only --diff-filter=U || true)"

            if [ -n "$CONFLICTS" ]; then
              printf '%s\n' "$CONFLICTS" > merge-conflicts.txt

              {
                echo
                echo "Files with overlapping changes:"
                printf '%s\n' "$CONFLICTS"
                echo
                echo "Conflicting hunks use fork-side priority."
              } >> merge-report.txt

              git merge --abort

              set +e
              git merge --no-ff -X ours --no-edit "$UPSTREAM_SHA"
              MERGE_STATUS=$?
              set -e

              REMAINING="$(git diff --name-only --diff-filter=U || true)"

              if [ "$MERGE_STATUS" -ne 0 ] || [ -n "$REMAINING" ]; then
                echo "::error::Merge still has unresolved conflicts."
                printf '%s\n' "$REMAINING"
                exit 1
              fi

              echo "MERGE_POLICY=fork-priority" >> "$GITHUB_ENV"
              echo "Merge status: merged with fork-side conflict priority" >> merge-report.txt

            elif [ "$MERGE_STATUS" -eq 0 ]; then
              git commit --allow-empty -m "Merge upstream 2dust/v2rayNG master"

              echo "MERGE_POLICY=normal-merge" >> "$GITHUB_ENV"
              echo "Merge status: clean merge" >> merge-report.txt

            else
              echo "::error::Merge failed."
              exit 1
            fi
          fi

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "::error::Unresolved conflicts remain."
            exit 1
          fi

          git diff --check
          git submodule update --init --recursive

          MERGED_SHA="$(git rev-parse HEAD)"
          echo "MERGED_SHA=$MERGED_SHA" >> "$GITHUB_ENV"
          echo "Merged commit: $MERGED_SHA" >> merge-report.txt

          cat merge-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: "14742923"
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 \
            --install "ndk;30.0.16248370"

          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Configure Android build and dependencies
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          path = Path("V2rayNG/app/build.gradle.kts")
          content = path.read_text(encoding="utf-8")

          upstream_sha = os.environ["UPSTREAM_SHA"]
          upstream = subprocess.check_output(
              [
                  "git",
                  "show",
                  f"{upstream_sha}:V2rayNG/app/build.gradle.kts",
              ],
              text=True,
          )

          def get_value(name):
              pattern = (
                  rf'(?m)^[ \t]*{re.escape(name)}[ \t]*=[ \t]*'
                  rf'(?:"([^"]*)"|(\d+))[ \t]*$'
              )
              match = re.search(pattern, upstream)

              if not match:
                  raise SystemExit(f"Cannot read upstream {name}")

              return match.group(1) if match.group(1) is not None else match.group(2)

          version_code = get_value("versionCode")
          version_name = get_value("versionName")

          content, code_count = re.subn(
              r"(?m)^([ \t]*versionCode[ \t]*=[ \t]*)\d+([ \t]*)$",
              lambda m: f"{m.group(1)}{version_code}{m.group(2)}",
              content,
              count=1,
          )

          content, name_count = re.subn(
              r'(?m)^([ \t]*versionName[ \t]*=[ \t]*)"[^"]*"([ \t]*)$',
              lambda m: f'{m.group(1)}"{version_name}"{m.group(2)}',
              content,
              count=1,
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit("Cannot safely update application version")

          if re.search(r"(?m)^[ \t]*ndkVersion[ \t]*=", content):
              content, ndk_count = re.subn(
                  r'(?m)^([ \t]*ndkVersion[ \t]*=[ \t]*)"[^"]*"',
                  lambda m: f'{m.group(1)}"30.0.16248370"',
                  content,
                  count=1,
              )
          else:
              content, ndk_count = re.subn(
                  r"(?m)^android[ \t]*\{[ \t]*$",
                  'android {\n    ndkVersion = "30.0.16248370"',
                  content,
                  count=1,
              )

          if ndk_count != 1:
              raise SystemExit("Cannot safely configure NDK version")

          libbox_pattern = re.compile(r"\bio\.nekohasekai\.libbox\b")
          references = []

          for source in Path("V2rayNG/app/src").rglob("*"):
              if source.suffix not in {".kt", ".java"}:
                  continue

              for line_number, line in enumerate(
                  source.read_text(
                      encoding="utf-8",
                      errors="replace",
                  ).splitlines(),
                  1,
              ):
                  if libbox_pattern.search(line):
                      references.append(
                          f"{source}:{line_number}: {line.strip()}"
                      )

          if references:
              raise SystemExit(
                  "Source references sing-box libbox classes, but the "
                  "conflicting libbox AARs are not being built. "
                  "These references need a compatible implementation:\n"
                  + "\n".join(references)
              )

          content, removed = re.subn(
              r'(?m)^[ \t]*implementation\(files\("libs/libbox(?:-legacy)?\.aar"\)\)[ \t]*\r?\n',
              "",
              content,
          )

          path.write_text(content, encoding="utf-8")

          print(f"Upstream versionCode: {version_code}")
          print(f"Upstream versionName: {version_name}")
          print(f"Removed explicit libbox dependencies: {removed}")
          print("The go.Seq import is retained for libv2ray.")
          PY

      - name: Build hevtun native libraries
        shell: bash
        run: |
          set -euo pipefail
          bash compile-hevtun.sh

      - name: Stage native libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p V2rayNG/app/libs
          cp -r libs/. V2rayNG/app/libs/

      - name: Find AndroidLibXrayLite release tag
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_TAG="$(git -C AndroidLibXrayLite describe --tags --abbrev=0)"

          if [ -z "$CURRENT_TAG" ]; then
            echo "::error::AndroidLibXrayLite release tag was not found."
            exit 1
          fi

          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"
          echo "Using AndroidLibXrayLite tag: $CURRENT_TAG"

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.CURRENT_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Play Store debug APK
        working-directory: V2rayNG
        shell: bash
        run: |
          set -euo pipefail

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew

          ./gradlew \
            :app:assemblePlaystoreDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK and create report
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="V2rayNG/app/build/outputs/apk/playstore/debug"

          {
            echo "# v2rayNG merge build"
            echo
            echo "- Fork master: ${FORK_MASTER_SHA:-unknown}"
            echo "- Official upstream: ${UPSTREAM_SHA:-unknown}"
            echo "- Merged commit: ${MERGED_SHA:-unknown}"
            echo "- Merge policy: ${MERGE_POLICY:-unknown}"
            echo
            echo "## APK files"
          } > build-report.txt

          if [ -d "$APK_DIR" ]; then
            mapfile -t APKS < <(
              find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | sort
            )

            if [ "${#APKS[@]}" -gt 0 ]; then
              for APK in "${APKS[@]}"; do
                sha256sum "$APK" >> build-report.txt
              done
            else
              echo "No APK was produced." >> build-report.txt
            fi
          else
            echo "APK directory does not exist." >> build-report.txt
          fi

          cat build-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2rayNG-merged-build
          path: |
            V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
            build-report.txt
            merge-report.txt
            merge-conflicts.txt
          if-no-files-found: warn

      - name: Publish merged source to fork master
        if: success()
        shell: bash
        env:
          REPO_WRITE_TOKEN: ${{ secrets.REPO_WRITE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${REPO_WRITE_TOKEN:-}" ]; then
            echo "::error::REPO_WRITE_TOKEN is missing."
            exit 1
          fi

          git diff --check
          git push origin HEAD:refs/heads/master

          {
            echo
            echo "## Publication"
            echo
            echo "Published commit: $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
