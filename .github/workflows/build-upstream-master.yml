name: Build APK from official v2rayNG master

on:
  push:
    branches:
      - ci-master-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout official upstream master
        uses: actions/checkout@v7
        with:
          repository: 2dust/v2rayNG
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}
          path: source
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Record source SHA and publish upstream-master branch
        id: publish_source
        continue-on-error: true
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_SHA="$(git -C source rev-parse HEAD)"
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> "$GITHUB_ENV"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          git -C source remote set-url origin "https://github.com/${TARGET_REPOSITORY}.git"
          git -C source push origin HEAD:refs/heads/upstream-master

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        shell: bash
        run: |
          set -euo pipefail
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Configure NDK version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/V2rayNG/app/build.gradle.kts")
          s = p.read_text()
          marker = "android {\n"
          if s.count(marker) != 1:
              raise SystemExit("Unexpected build.gradle.kts structure; refusing to modify it")
          s = s.replace(marker, marker + '    ndkVersion = "29.0.14206865"\n', 1)
          p.write_text(s)
          PY

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Build hevtun native library
        working-directory: source
        run: bash compile-hevtun.sh

      - name: Copy hevtun libraries
        working-directory: source
        run: |
          mkdir -p V2rayNG/app/libs
          cp -r libs/. V2rayNG/app/libs/

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      - name: Build sing-box Android core
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.15.0-alpha.6 https://github.com/SagerNet/sing-box.git sing-box
          cd sing-box
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          go run ./cmd/internal/build_libbox -target android
          mkdir -p "$GITHUB_WORKSPACE/source/V2rayNG/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/source/V2rayNG/app/libs/libbox.aar"
          cp libbox-legacy.aar "$GITHUB_WORKSPACE/source/V2rayNG/app/libs/libbox-legacy.aar"

      - name: Find AndroidLibXrayLite release tag
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_TAG="$(git -C source/AndroidLibXrayLite describe --tags --abbrev=0)"
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"
          echo "AndroidLibXrayLite tag: $CURRENT_TAG"

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.CURRENT_TAG }}
          fileName: libv2ray.aar
          out-file-path: source/V2rayNG/app/libs/

      - name: Build Play Store debug APK
        working-directory: source/V2rayNG
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:assemblePlaystoreDebug --no-daemon --stacktrace

      - name: Verify APK and write report
        shell: bash
        env:
          PUBLISH_SOURCE_OUTCOME: ${{ steps.publish_source.outcome }}
        run: |
          set -euo pipefail
          apk_dir="source/V2rayNG/app/build/outputs/apk/playstore/debug"
          mapfile -t apks < <(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APK files were produced"
            exit 1
          fi
          {
            echo "Official source: 2dust/v2rayNG master"
            echo "Source SHA: $UPSTREAM_SHA"
            echo "Publishing upstream-master branch: $PUBLISH_SOURCE_OUTCOME"
            echo "Build variant: Play Store debug"
            echo "APK files and SHA-256:"
          } > "$GITHUB_WORKSPACE/build-report.txt"
          for apk in "${apks[@]}"; do
            sha256sum "$apk" | tee -a "$GITHUB_WORKSPACE/build-report.txt"
          done
          cat "$GITHUB_WORKSPACE/build-report.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and report
        uses: actions/upload-artifact@v7
        with:
          name: v2rayNG-master-playstore-debug
          path: |
            source/V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
            build-report.txt
          if-no-files-found: error

